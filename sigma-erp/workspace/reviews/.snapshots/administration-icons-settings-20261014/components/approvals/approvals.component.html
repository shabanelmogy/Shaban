<div class="card">
    <div class="card-header d-flex align-items-center">
        <h3>{{ 'settings.approvals' | translate }}</h3>
    </div>
    <div class="card-body">
        <form appMockData [formGroup]="approvalForm">
            <div class="col-12 col-md-6 col-lg-3 mb-12">
                <label class="h3 my-4">
                    {{ 'settings.approvalsModel.voucherType' | translate }}
                </label>
                <p-dropdown formControlName="voucherType" [options]="voucherTypesOptions()" optionLabel="value"
                    optionValue="id" class="w-100"
                    placeholder="{{ 'settings.approvalsModel.voucherType' | translate }}">
                </p-dropdown>
            </div>
            <div class="row fw-semibold text-muted mb-3 d-none d-lg-flex border-gray-200 pb-2">

                <div class="col-lg-5 h3">
                    {{ 'settings.approvalsModel.levelName' | translate }}
                </div>
                <div class="col-lg-5 h3">
                    {{ 'settings.approvalsModel.user' | translate }}
                </div>
                <div class="col-lg-1"></div>
            </div>

            <div formArrayName="items">

                <div *ngFor="let fg of getItems.controls; let i = index" [formGroupName]="i"
                    class="row align-items-end gy-3 mb-3 border-bottom-4 pb-3">

                    <div class="col-12 col-md-6 col-lg-5">
                        <label class="form-label d-lg-none"> {{ 'settings.approvalsModel.levelName' | translate }}
                        </label>
                        <input class="form-control" formControlName="levelName"
                            placeholder="{{ 'settings.approvalsModel.levelName' | translate }}" />
                    </div>
                    <div class="col-12 col-md-6 col-lg-5">
                        <label class="form-label d-lg-none">
                            {{ 'settings.approvalsModel.user' | translate }}
                        </label>
                        <input class="form-control" formControlName="user"
                            placeholder="{{ 'settings.approvalsModel.user' | translate }}" />
                    </div>
                    <div class="col-12 col-md-6 col-lg-1 text-end">
                        <button type="button" class="btn btn-danger w-100 w-lg-auto" (click)="removeItem(i)">
                            {{ 'settings.nationIdFormatModel.deleteRow' | translate }}
                        </button>
                    </div>

                </div>
            </div>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-stretch gap-3 mt-4">
                <button type="button" class="btn btn-primary" (click)="addItems()">
                    {{ 'settings.nationIdFormatModel.addRow' | translate }}
                </button>
                <app-buttons [endButtons]="buttons" (buttonsClick)="onButtonClick($event)">
                </app-buttons>
            </div>

        </form>
    </div>
</div>
