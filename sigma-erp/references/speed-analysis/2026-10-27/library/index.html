forming a walk-around check of any vehicle.\nEven more, it is a cloud-based solution that means you will never lose your data i-e the history of your vehicle check. So, Speed – SCS is an affordable, reliable, and robust solution for you.\nStart 15 Days Free Trial\nSafety Check System (SCS) Benefits\nGet Rid Of the Manual Procedure No Chance of Errors & OmissionsReport the Results in a Specific Format Go Paperless & Get Rid of Manual Procedures Record & Retain the History of Your Vehicle MaintenanceThe Digitized Solution Makes You More Smart & ResponsiveIt is Handy – Pick Your Smartphone & Start Inspecting Your VehicleIntegrate the Solution With Other Speed Auto Systems’ Products Easily\nLet’s get you Started\nIf you want to know more about UK Saftey Check System (SCS), let’s get connected.\nGet in Touch"}, {"id": "S144", "product": "uk-vehicle-safety-check-system", "kind": "product-reference", "title": "UK Vehicle Safety Check System (SCS)", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/features/", "path": "pages/7e4e71fb59a3d96c.html", "text": "Get Started Now\nDVSA UK Vehicle Safety Check Process Automation\nUK Vehicle Safety Check System (SCS)\nUK Vehicle Safety Check System (SCS) – Features\nOverview Benefits Features Pricing Start 15 days Free Trial User Guide Sign In\nHome\n»\nUK Vehicle Safety Check System\n»\nUK scs Features\nUK Vehicle Safety Check System (SCS) – Features\nBefore getting started, it would be better to get enough know-how of the App as a stitch on time saves nine. UK Vehicle Safety Check System (SCS) is easier and stress-free.\nThough salient features are listed below, yet we are always open to going for customizable solutions. So, you can ask to add, modify, or remove any feature as per your needs.\nDashboard\nThe dashboard appears as soon as you open the App. So, it is the main interface and is further divided into seven default modules. These seven default modules are;\n1. Fleet\n2. Inspections\n3. Administration\n4. Support\n5. Data Entry Corrections\n6. Customizations\n7. Subscriptions & Billing\n1. Fleet\nThe Fleet module allows you to add, edit, and remove vehicles as quickly and easily as you need. It usually deals with the vehicles’ details, management, and current status. A typical “Fleet” module does hold further three options.\n. Vehicles\nUnder the “Vehicles” option, you would be able to add a new vehicle by clicking on the “Create New Vehicle” tab. Also, you can see a list of all the added vehicles in certain a hierarchal fashion. Moreover, it will allow you to sort out vehicles based on the status.\n. Vehicle Types\nHere you can add and manage vehicle types. By clicking on “Create New Vehicle Type” you will see a comprehensive form to add details and save. These added vehicle types would help you to assign a certain type to a vehicle when adding a new vehicle in the above-mentioned vehicles module.\n. Vehicle QR Labels Inspections\nOnce you have added all the details and type, you can generate distinctive QR labels for each vehicle. Customizable sizes of QR labels will enable you to paste them either on key-chain or the door of your vehicle.\n2. Inspection\nAs the name suggests, this module will enlist all the performed inspections in one place. Moreover, you will be able to choose dynamically between date range and vehicle to see what inspections were carried out. For instance, select a date range like 15/05/2020 – 20/05/2020, click on the “Search” tab and get the list of all the vehicles inspected in the meantime.\n3. Administration\nThe administration module bestows full control over the management of the SCS App. So, go like a professional and grasp like a boss. The administration panel is also divided into further options.\n. Branches\nUK Vehicle Safety Check System (SCS) is a one-stop-solution. So, it offers you to manage as many branches as you want with this single system. Branches module allows you to add your business branches located at other territories, cities, and even in other countries.\n. Safety Check Templates\nThe safety check process requires different things to inspect and record as per the vehicle type. For instance, what required for a PSV is different than the HGV does. So, to record the observations, you need different templates. Speed – UK Safety Check System (SCS) App offers three default templates that you can use initially.\n. Roles\nRoles option enables you to create a certain role with specified permissions. So, you are in full control to create a role and apply limitations or authorities.\n. Users\nUsers tab lets you manage all the “users” that are logged in to your system. For instance, you have a manager to perform a daily walk-around vehicle check, you would be able to add him, assigning the role of safety manager from Roles tab, to allow him to use the App effectively.\n. Languages\nYou can choose the language as per your region and native inclination. In this option there a dropdown list of languages of which you can select anyone. Is your language not listed? No problem, you can ask us to add it.\nSome additional features are listed below:\nSign Up From Your Smartphone\nAnother valuable feature is the facility to get signed up from your smartphones. All you need would be to install the Safety Check System (SCS) App from google play store and install it in your device. Then, go for sign up and feed the asked details. Here you are ready to go.\nClick Below to go for Speed – Safety Check System (SCS) App on Google Play Store;\nUK (SCS) Google Play\nSign Up From Web App\nDon’t you want to use a smartphone in your office? No problem. Speed – Safety Check System (SCS) can be signed up from the web browser on your PC as well. So, open the Speed – Safety Check System (SCS) web app in your browser, fill in the Sign-Up form, and it’s all set to start experiencing the automation of vehicle walk-around check.\nClick below to go for the Speed – Safety Check System (SCS) Web App:\nUK (SCS) Web App\nAutomatic Form Template As Per DVSA Regulations\nInspection forms are integrated into the Speed – Safety Check System (SCS). These forms are formulated according to the UK’s Driver and Vehicle Safety Agency (DVSA) requirements. So, you can record every essential observation that the authorities demand.\nInspection Templates According To The Vehicle Type\nEither you have an HGV, PSV, or a personal Van, Speed – Safety Check System (SCS) provides you with the customized templates. So, the form for HGV inspection would include all the details required for HGV inspection, and so do for PSV and Personal Van.\nAll Inspections On Web App\nOnce you have done your inspection with the smartphone App, all the inspection data would be available on the Web App. So, after executing a vehicle’s walk-around check, you have to go for Web App which you can open in any browser either on your smartphone or PC. On the Web App, get Signed-In and have all the inspection data ready to treat in either way.\nModify, Add, Or Remove Any Module\nYes, the App is totally in your hand. It’s inspection forms are fully customizable. So, you can update any module or sub-module as soon as the DVSA modifies its regulations. Moreover, if you find some modules as extra or essential, you would be able to remove or add it respectively.\nStart 15 Days Free Trial\nLet’s get you Started\nIf you want to know more about UK Saftey Check System (SCS), let’s get connected.\nGet in Touch"}, {"id": "S145", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "User Guide UK SCS", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/", "path": "pages/aa5540ff9782154d.html", "text": "Opening Speed – UK Vehicle Safety Check System Web App\nDownloading Speed – UK Vehicle Safety Check System (SCS) Android Mobile App\nHow to Sign UP\nHow to Sign-In\nForgot Password\nFleet\nVehicle\nVehicle Types\nVehicle QR Labels\nInspections\nAdministration\nBranches\nSafety Check Templates\nRoles\nUsers\nLanguages\nError Logs\nSettings\nSupport\nData Entry Corrections\nCustomizations\nSubscriptions & Billing"}, {"id": "S146", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Branches", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/branches/", "path": "pages/c410bba25f2a93d8.html", "text": "Watch source video online\nBranches\nIf you have more than one branch operations, this module is for you. “+CREATE NEW BRANCH” tab allows you to add as many branches you need. It will help you to keep all the data in access, unified, and easily available. So, manage all your branches with a single click."}, {"id": "S147", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Customizations", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/customizations/", "path": "pages/e080f12c867792ba.html", "text": "Watch source video online\nCustomizations\nThe customization module allows you to request particular customization in the system. Though the Speed – UK Vehicle Safety Check System (SCS) is efficient enough to fulfill all your needs, yet you can go for customizations. Our technical team will communicate and coordinate to bring your idea into life."}, {"id": "S148", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Data Entry Corrections", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/data-entry-corrections/", "path": "pages/08290416292651b0.html", "text": "Watch source video online\nData Entry Corrections\nAgain if you have a Service Level Agreement (SLA), you can ask us for a data entry correction. At times, you may face any data entry related issue. If this happens, go to the Data Entry Corrections Module and click on the “+CREATE DATA ENTRY CORRECTION.” Our support team will contact you and help you to fix that issue."}, {"id": "S149", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Downloading Speed – UK Vehicle Safety Check System (SCS) Android Mobile App", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/downloading-speed-car-rental-software-android-mobile-app/", "path": "pages/55f5f691421c0e08.html", "text": "Watch source video online\nDownloading Speed – UK Vehicle Safety Check System (SCS) Android Mobile App\nOpen Google Play Store on your Android mobile phone or tablet.\nType in the search box “UK Vehicle Safety Check System”\nYou will find the “UK Vehicle Safety Check System “ mobile app. Install it.\nYou can download Speed – UK Vehicle Safety Check System Android Mobile App by clicking the link https://play.google.com/store/apps/details?id=com.speedautosystems.ukscs&hl=en"}, {"id": "S150", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Forgot Password", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/forgot-password/", "path": "pages/450fee55c4a69f0f.html", "text": "Watch source video online\nForgot Password\nOps! Have you forgot your password? No problem. Go to the sign-in option and search for the “FORGOT PASSWORD?.” Click on it and put the information which is required. You will receive an email with a link to reset your password. Now choose a new password and keep enjoying our service.\nhttps://app.speedautosystems.com/Account/ForgotPassword"}, {"id": "S151", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "HOW TO SIGN-IN UK VEHICLE SAFETY CHECK SYSTEM", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/how-to-sign-in/", "path": "pages/034386f16f05a445.html", "text": "Watch source video online\nHOW TO SIGN-IN\nOnce you have signed up, you are no more required to go through all that process. For singing-in, all you need is your email and password that you have used while signing-up. Click the link below for sign-in now;\nhttps://app.speedautosystems.com/Account/Login"}, {"id": "S152", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "HOW TO SIGN-UP UK VEHICLE SAFETY CHECK SYSTEM", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/how-to-sign-up/", "path": "pages/0f79728bc2f5e7a0.html", "text": "Watch source video online\nHOW TO SIGN-UP\nWe have made signing up as easier as possible. That means you need to fill a few lines and here you go. Just fill the basic information and you are signed up. Navigate the below link if you want to sign-up right now;\nhttps://app.speedautosystems.com/TenantRegistration?product=scs"}, {"id": "S153", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Inspections", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/inspections/", "path": "pages/e588d28cc80410a5.html", "text": "Watch source video online\nInspections\nThe inspection module allows you to see all the vehicles inspected. It shows a list in which you can see all the vehicles, date & time when inspected, make model, and other details. Search tab offers you seek for a certain vehicle by adding either date range or vehicle. So, you can select a specific date range and acquire the list of all the vehicles inspected during that period."}, {"id": "S154", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Languages", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/languages/", "path": "pages/7e38a2012bd536f3.html", "text": "Watch source video online\nLanguages\nThe default language of the Speed – UK Vehicle Safety Check System (SCS) is English. However, if you are an expatriate living in the UK and want to operate the SCS App in your native language, then you can go to the language module and choose as per your choice. However, you can also ask us to add your language manually if your language is not enlisted there."}, {"id": "S155", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Opening Speed – UK Vehicle Safety Check System Web App", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/opening-web-app/", "path": "pages/084343232173a905.html", "text": "Watch source video online\nOpening – UK Vehicle Safety Check System Web App\nOpen any browser like Chrome, Edge, Firefox, Safari on you PC, MacBook, iPad, iPhone, Android Phone, Android Tablet.\nOpen link https://app.speedautosystems.com\nIf you don’t have an account then signup using the link https://app.speedautosystems.com/TenantRegistration?product=scs"}, {"id": "S156", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Roles", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/roles/", "path": "pages/92a5abce39fd593a.html", "text": "Watch source video online\nRoles\nIf you have other employees like fleet managers to use this App, you can define their roles here. “+CREATE NEW ROLE” would allow you to create a role and manage permissions. So, the user of this role will sign-in and be limited to the extent you have set and required by his/her job."}, {"id": "S157", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Safety Check Templates", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/safety-check-templates/", "path": "pages/171a6b335820a48e.html", "text": "Watch source video online\nSafety Check Templates\nUK’s Driver and Vehicle Standard Agency (DVSA) has proposed different kinds of walk-around checks for HGV, PSV, and Personal Vans. So, you would need a different template when inspecting a PSV as compared to the HGV. In Safety Check Templates you would find."}, {"id": "S158", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Settings", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/settings/", "path": "pages/e64705f24f516508.html", "text": "Watch source video online\nSettings\nAs the name suggests, the Settings module allows you to manage your profile, general App settings, user management, documents administration, and email system. It is easy to manage."}, {"id": "S159", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Subcriptions & Billing", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/subscriptions-billing/", "path": "pages/811e27125ce449ac.html", "text": "Watch source video online\nSubscriptions & Billing\nThis module manages all the monetary matters between you and the Speed Auto Systems. So, you can pay your subscription fee, renew the subscription, and see your payment history. This is secured by the “Stripe” and we ensure data privacy as well as sensitive information protection."}, {"id": "S160", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Support", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/support/", "path": "pages/d52f45d79c86374b.html", "text": "Watch source video online\nSupport\nIf you have any Service Level Agreement (SLA) with Speed Auto systems, you can ask us for support. So, if you are facing any issue go to the Support module, and click on the “+CREATE SUPPORT REQUEST.” Our representative will contact you as soon as possible. Afterward, your problem would be resolved on a priority basis."}, {"id": "S161", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Users", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/users/", "path": "pages/d48dd84a64d09dbd.html", "text": "Watch source video online\nUsers\nIn the “USERS” module you will be able to create a user by clicking on “+CREATE NEW USER.” This will help you to add details of a particular user and assign a specific role. This role can be managed further in the “ROLES” tab."}, {"id": "S162", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Vehicle QR Labels", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/vehicle-qr-labels/", "path": "pages/32d22d146dac6453.html", "text": "Watch source video online\nVehicle QR Labels\nQR labels help to save time and prevent from making mistakes. Once you have added vehicle details in the App, it will allow you to generate unique QR labels for each vehicle. Now, you can print that label and paste it either on the vehicle’s door or keyring. In the future, if you need to know about a vehicle, just scan the QR label with SCS App and your Smart Phone camera, all details would be displayed on the screen immediately."}, {"id": "S163", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Vehicle Types", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/vehicle-types/", "path": "pages/d38cd0eea6d79412.html", "text": "Watch source video online\nVehicle Types\nVehicle Types sub-modules allows you to add a vehicle type. Once you have added a vehicle type, you would be able to use it in the App anywhere. For instance, you have added an HGV with all necessary details, you will be able to use it when carrying a walk-around check, status update, and many more."}, {"id": "S164", "product": "uk-vehicle-safety-check-system", "kind": "user-guide", "title": "Vehicles", "url": "https://speedautosystems.com/uk-vehicle-safety-check-system/user-guide/vehicles/", "path": "pages/5c7dc3499965633b.html", "text": "Watch source video online\nVehicles\nWhen you have to know about your fleet, you would have to click on the vehicles tab. This tab will show all the vehicles enlisted categorically. On the top right side, you will see a button of “+ CREATE NEW VEHICLE.” This button allows you to add a new vehicle as per your demand and need. Moreover, you can search for a specific vehicle by adding “Plate No” or “Status.”"}, {"id": "S165", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Speed Vehicle Leasing Software", "url": "https://speedautosystems.com/vehicle-leasing-software/", "path": "pages/484a21a92c6f469e.html", "text": "Get Started Now\nComprehensive Vehicle Leasing ERP\nSpeed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\nVLS Menu\nSpeed Vehicle Leasing Software (VLS)\nSpeed Vehicle Leasing Software (VLS)\nIf you are a leasing operator with different types of supplementary transportation services like rental, chauffeur, limo, passenger transportation & trying to find some comprehensive software solution then you have come to the right place. We provide a comprehensive solution Speed Vehicle Leasing Software (VLS) which not only provide the automation of leasing operations but also the automation of all your supplementary transportation services. Further we provide the automation of your Finance Department, Sales and HR Department. Benefit of a single platform provides you strong visibility into your business, revenue optimization and cost minimization.\nIf your whole operation is leasing without any other supplementary transportation models, Speed Vehicle Leasing System (VLS) will still be very beneficial for you due to automation of all your manual processes like Traffic Fines Process Automation, Road Tolls Process Automation, Fuel Process Automation, Damage Charging Process Automation, Vehicle Inspection Process Automation using Mobile App etc.\nLease Process Automation\nSpeed – Vehicle Leasing Software (VLS) fully automates the Leasing Process. It can be changed as per your specific leasing requirements. Default Leasing Process Automation is as per below steps:\nLease inquiry handling\nLease quotation preparation\nLease quotation internal approval\nLease quotation revision as per customer request\nLease quotation customer approval\nMaster Lease agreement preparation\nIndividual Lease agreement preparation\nTemporary vehicles delivery if required\nLease vehicles procurement\nLease vehicles preparation\nLease vehicles delivery\nLease invoicing\nFines, Tolls, Excess Mileage, Damage Invoicing\nEarly Lease Termination Handling if there is.\nLease Agreement Closure\nLease Agreement Performance Analysis\nMobility Solution\nField processes automation which were not cost effective in the past are now feasible due to low cost of mobile internet & low cost of mobile devices. Further, mobile connectivity coverage is almost everywhere. Speed Mobility Solution automates all your remote leasing processes like:\nVehicle Inspection using Mobile App on:\nLease Vehicle Delivery\nLease Replacement\nLease Vehicle Collection\nNon-Revenue Movement Opening\nNon-Revenue Movement Closing\nWorkshop Movement Opening\nWorkshop Movement Closing\nCustomer digital signature on Mobile App for the acknowledgment of vehicle checkout & check-in\nDrivers Live Tracking on Google Map\nDrivers Tasks Management to optimize Drivers’ Performance\nDrivers Rating by customers while getting signature from customer on Mobile App\nManual Processes Automation\nEach process optimization & automation improves your profitability. Each manual process is a burden to maintain. Speed – Vehicle Leasing Software (VLS) provides the automation of almost all manual processes like:\nTraffic Fines Process Automation\nRoad Tolls Process Automation\nFuel Process Automation\nPayment Process Automation\nIf you want to automate any manual process specific to your business or specific to your country, we can definitely work together to automate it.\nDocuments Management System\nIt is a cumbersome job to file all the physical documents related to leasing operations. Speed – Vehicle Leasing Software (VLS) has its inbuilt Document Management System (DMS).\nVehicle Documents:\nVehicle Registration Card\nVehicle Insurance Policy\nCorporate Customer Documents:\nTrade License\nCredit Approval Documents\nChamber of Commerce Certificate\nIndividual Customer Documents:\nNational ID/Passport\nDriving License\nSpeed – Vehicle Leasing Software (VLS) has full electronic file of Lease agreement containing:\nSigned Lease Agreement\nLessee Documents\nVehicle Lease Delivery Document\nVehicle Replacement Vouchers\nVehicle Check-out & Check-in Documents\nEmail & SMS Notification Engine\nSpeed – Vehicle Leasing Software (VLS) has a Notification Engine to notify customers, suppliers & employees for different notifications. Notification can be email or SMS or both depending on the type of notification.\nDifferent types of automatic notification are:\nInvoice emailing on invoice generation\nStatement of Account emailing on month’s end\nOverdue invoice/debt reminder email/SMS\nVehicle Registration Expiry alert email/SMS\nVehicle Service Due Reminder email/SMS\nTraffic Fine alert email/SMS\nCredit Card Expiry email/SMS\nDriving License Expiry email/SMS\nNational ID/Passport Expiry email/SMS\nSales Promotion email/SMS\nAgreement email\nReceipt email\nVehicle Check Card Email on Vehicle Mobile Inspection\nLease Performance Analysis\nSpeed – Vehicle Leasing Software (VLS) provides you Lease Performance Analysis from different angles like:\nProfit per Individual Lease Agreement\nProfit per Master Lease Agreement\nForecasted (Budgeted) Profit vs Actual Profit\nProfit per each Lease Customer\nWe are working to provide you more insights into your lease performance.\nAdd-on Systems\nAs per your business requirements, you can add any additional add-on systems available on Speed Software Platform.\nBeing part of the Speed Platform, each system can talk to other systems without any need of integration. Data flows seamlessly from one system to other system. Different available add-on options are:\nCar Rental System (CRS)\nLimo System (Limo)\nTransportation System (TS)\nWorkshop System (WS)\nFinancial System (FS)\nHuman Resource Management System (HRM)\nCustomer Relationship Management System (CRM)\nInterface with SAP, Oracle, Microsoft or Sage\nSpeed – Vehicle Leasing Software (VLS) can be interfaced with any known ERP like SAP, Oracle, Microsoft Dynamics, Epicor or Sage using one of three methodologies:\nWe provide you our system API & your ERP implementer build the interface using our API\nWe share the data in staging database which your ERP implementer use to build the interface\nWe build the interface by using your ERP API\nLatest Technology & Regular Updates\nSpeed – Vehicle Leasing Software (VLS) including Speed Software Platform is developed using latest technologies. It is a multi-layered, multi-tenant cloud system. Different technologies used are:\nFront End\nAngularJs\nMicrosoft Razor View Engine\nCSS/HTML\nSPA\nBack End\nMicrosoft .Net\nWeb API\nSQL Database\nMulti-Tenancy Structure\nInfrastructure\nCloud Based\nMicrosoft Azure\nGoogle Cloud\nGoogle Maps\nSpeed Vehicle Leasing Software (VLS) can be used on cloud & can be hosted on your infrastructure. We release regular updates as per the collective knowledge & feedback of our valued customers.\nMultilingual\nTo operate the software in a language which is not yours; can add more complexity in already existing complexed business. Further for your domestic regulatory compliance, you may have no option except to generate all legal documents related to Leasing operation into your native language.\nSpeed – Vehicle Leasing Software has the facility to operate it in your language. If you don’t like some label or caption; you can change it through the Language Settings Layer.\nAccessible from Anywhere\nSpeed – Vehicle Leasing Software (VLS) can be accessed from anywhere using any device laptop, mobile, MacBook, tablet etc. You just need browser & internet connection.\nOn a bigger display, you will use software in full screen mode while on a mobile screen, the system will automatically change in mobile mode. This accessibility convenience really improves productivity which may cause improvement in profitability.\nStart 30 Days Free Trial\nSpeed Auto Systems\n5.0Based on 36 reviews\npowered by\nreview us on\nBogdan Shishmanov4 years ago\nWe received wonderful service by Rent a Car Budget Aqaba Jordan.\nAccounts Sahab4 years ago\nSecretary Yoko Transport4 years ago\nAdvanced Rent a Car LLC4 years ago\nTRULY A GREAT PRODUCT. THE OVERALL SERVICE HAS COVERED ALL ASPECTS OF OUR BUSINESS FROM OUR LEASING/RENTAL SYSTEMS TO OUR BACK-END OPERATIONS INCLUDING CRM AND FINANCIALS.\nRoji Mathew4 years ago\nAl Monsef4 years ago\nOne Platform solution for all Business functions, Finance, HRM, CRM, Traffic Fines, Tolls, Fuel & Field Processes Automation. We are well satisfied with the product.\nReception Bottomline4 years ago\nSpeed has got best User Friendly Interface Of Car Rental System. The Support and Customer care from Speed is exceptional. Keep up the good work. Thumbs Up!\nAl Sayara Al sareea Car Rental4 years ago\nWe're one of the satisfied customers of Speed. Dealing with this company for how many years now. Thanks Omer and team for your assistance every time needed and for your commitment in giving the best service. May God increase and bless you!\nTanveer Ahmed4 years ago\nSpeed Car Rental Systems provided Cloud-based quick and easy access to our data and records. Amazing facility to access from anywhere at any time. Keep it Up\nShabeer Madathodiyil4 years ago\nIts a very user friendly Software for car rental companies operations and accounts, Great support from Customer care team.\nHighly recommendable Software\nLet’s get you Started\nIf you want to know more about Speed Vehicle Leasing System (VLS), let’s get connected.\nGet in Touch"}, {"id": "S167", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/decrease-your-it-cost/", "path": "pages/5b266d980136e383.html", "text": "Home\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nDecrease Your IT Cost\nSpeed Vehicle Leasing Software (VLS)\nDecrease Your IT Cost\nBusiness expenses can take a hefty chunk of your profits and force you to choose between business growth and its equipment for stability. Especially when that equipment is not as essential as you think it is. We are talking about the high IT cost that comes with maintaining your business software.\nAll those high-tech servers, licenses for operating systems and databases necessary to keep any business application live, take a lot of resources to maintain and keep up to date. What if all these expenses are to be avoided altogether?\nSpeed – Vehicle leasing Software provides Cloud-based Leasing System, which keeps you ahead of your competition with the latest technology trends while simultaneously cutting down your IT expenses.\nNo need to go through the hassle of hiring a big team of IT professionals and setting up complicated hardware to run your business when it can be set up by us remotely, in just a few minutes.\nOur multifaceted leasing software also provides excellent ROI over the longer period of time, when you compound the high monthly recurring maintenance & security cost for your IT infrastructure. By choosing Speed Vehicle Leasing software, you are entitled to the highest data security level, provided by none other than Microsoft itself.\nAdditionally, our users need not go through any backup process periodically, as it is already taken care of by Microsoft as well which initiates backup every 1 minute. This means an extra layer of safeguarding is in place to mitigate any DRS (Disaster Recovery Solution) which could increase the cost of any business.\nWith such fantastic benefits, what are you waiting for? Try our 30 days’ trial for free and see it for yourself how we improve your profitability.\nStart 30 Days Free Trial"}, {"id": "S168", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/decrease-your-workload-with-road-toll-process-automation/", "path": "pages/870fe99919dd4b4f.html", "text": "Speed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nDecrease Your Workload with Road Toll Process Automation\nDecrease Your Workload with Road Toll Process Automation\nBeing a leasing operator means there is many toll data to be invoiced. It is a very tedious job to invoice road toll manually. Speed Vehicle Leasing Software (VLS) automates this process by using one of the below options:\nFetching road toll data from toll authority using API provided by the toll authority.\nIf there is no API interface provided by the toll authority, we have a smart component that can read toll data from the authority’s web portal.\nIf none of the above options is available, we have the facility to upload toll data files provided by the authority.\nOnce toll data is inside the system, Speed Vehicle Leasing Software (VLS) automatically allocates it against lease agreements. After allocation, the system generates toll invoices as per billing rules.\nStart 30 Days Free Trial"}, {"id": "S169", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/eliminate-redundant-work-with-speed-vehicle-leasing-software-api/", "path": "pages/63d9f43ee8020ba9.html", "text": "Speed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nEliminate Redundant Work with Speed – Vehicle Leasing Software API\nEliminate Redundant Work with Speed – Vehicle Leasing Software API\nIf different software systems used by your company are not connected then your staff have to update each system for the same information like the same customer account to be created in CRM, then in leasing system, and then in the financial system.\nThis is a duplication of work & pure waste. Further data mismatch in different systems causes confusion. Speed – Vehicle Leasing Software (VLS) has a solution for this problem in the form of API.\nDifferent systems such as Financial System, CRM, HRM can be connected with our Speed System with Speed System API. Data needs to be entered only once which can appear in other systems automatically without human intervention.\nStart 30 Days Free Trial"}, {"id": "S170", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/increase-your-insurance-access-revenue-decrease-your-vehicle-repair-cost/", "path": "pages/5e0fdb60c8acff13.html", "text": "Speed Vehicle Leasing Software (VLS) Benefits\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nINCREASE YOUR INSURANCE ACCESS REVENUE & DECREASE YOUR VEHICLE REPAIR COST\nINCREASE YOUR INSURANCE ACCESS REVENUE & DECREASE YOUR VEHICLE REPAIR COST\nIn paper-based vehicle checkout & checkin inspection, you can forget to charge the customer for any chargeable damage & it becomes your cost to repair the damage. Speed – Vehicle Leasing System (VLS) mobile app provides you facility to do vehicle checkout & checkin inspection through mobile. You can mark damages & take multiple pictures of each damage.\nYou get the customer electronic signature on mobile app for the acknowledgement. System will automatically charge the customer for any damage which is not covered. You can upload accident report through mobile app & web app.\nIf customer is at fault & he/she has not take sufficient waiver, the system will charge automatically. Digitalization of damage charging process minimizes customer disputes & speed up the debt collection of your damage invoices."}, {"id": "S171", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/increase-your-leasing-business-profitability-with-field-processes-automation/", "path": "pages/1599efcd87c5dbcd.html", "text": "Speed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nIncrease your Leasing Business Profitability with Field Processes Automation\nIncrease your Leasing Business Profitability with Field Processes Automation\nEach process optimization improves your profitability. Each optimized process automation drastically enhances your profitability. If Leasing Field Processes are not automated, then you are clueless about what is going on in your business.\nProcess Optimization + Automation = Enhanced Visibility + More Control + More Profitability\nSpeed – Vehicle Leasing System (VLS) provides you both optimization & automation of field processes like:\nLease Vehicle Delivery Process Automation through Mobile App\nVehicle Check-in & Checkout Process Automation through Mobile App\nVehicle Inspection through Mobile App\nDrivers Check-in & Checkout Process Automation.\nDrivers Live Tracking\nDrivers Tasks Management\nDrivers Overtime Management\nNon-Revenue Movements (NRM) through Mobile App\nStart 30 Days Free Trial"}, {"id": "S172", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/increase-your-productivity-by-accessing-leasing-system-from-your-mobile/", "path": "pages/ca1ab0ec6a9bcd87.html", "text": "Speed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nIncrease Your Productivity by Accessing Leasing System from Your Mobile\nIncrease Your Productivity by Accessing Leasing System from Your Mobile\nLet us consider a situation. You have some immediate requirements for some information from your leasing system. You are not in your office. Your leasing system is not accessible from your mobile. You will call someone in the office to send you the information, or you will have to wait to reach the office.\nLet us assume now the 2nd scenario. Your leasing system is accessible from your mobile device & you can efficiently operate it on the small screen of your mobile. Your productivity will be much higher as compared to the previous scenario.\nYou can fully operate Speed – Vehicle Leasing Software (VLS) on your mobile phone. Productivity increased by this convenience will improve business profitability too.\nStart 30 Days Free Trial"}, {"id": "S173", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/no-more-traffic-fines-leakage-with-traffic-fines-process-automation/", "path": "pages/3f3af739805f9fd9.html", "text": "Home\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nNo More Traffic Fines Leakage with Traffic Fines Process Automation\nNo More Traffic Fines Leakage with Traffic Fines Process Automation\nBeing a leasing operator, you receive many traffic fines on your lease vehicles from different authorities. If your process to charge traffic fines is not streamlined, then outstanding traffic fines become the company’s cost. Speed Vehicle Leasing Software (VLS) automates this process by using one of the below options:\nFetching, traffic fines from different authorities using API provided by each authority.\nIf there is no API interface available, we have a smart component that can read traffic fines from the authority’s web portal.\nSuppose none of the above options is available. In that case, we have the feature to upload traffic fines data files provided by the authorities or prepared manually by you.\nYou can enter all traffic fines one by one if nothing works.\nOnce traffic fines data is inside the system, Speed Vehicle Leasing Software (VLS) automatically allocates it against lease agreements. After allocation, the system generates traffic fines invoices.\nStart 30 Days Free Trial\nSpeed Vehicle Leasing Software (VLS)"}, {"id": "S174", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/benefit/reduce-your-leasing-operation-cost-with-paperless-leasing-operation/", "path": "pages/877ac64665d17386.html", "text": "Speed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nBenefit\n»\nReduce Your Leasing Operation Cost with Paperless Leasing Operation\nReduce Your Leasing Operation Cost with Paperless Leasing Operation\nPaper is a limitation for your optimum leasing operation. As much are papers in your leasing operation, that much you have to allocate resources (human & space) to manage them. If your country accepts a digital agreement, then your leasing operation will be entirely paperless. In case there is no digital agreement acceptance in your country, you can still reduce papers drastically in your business.\nNo Paper = Reduced Operating Cost + More Visibility + More Customer Satisfaction + More Profitability\nToo much Paper = Increased Operating Cost + Less Visibility + Less Customer Satisfaction + Less Profitability\nLet us show you how Speed – Vehicle Leasing Software (VLS) makes your business paperless.\nYou can attach a digital signature pad with Speed – Vehicle Leasing Software (VLS). Once you open a leasing agreement in the system, you can get the digital signature on the signature pad. The system will produce a digital agreement along with customer signatures. The system will email this digital lease agreement to the customer & CC it to you too. This digital agreement is stored in the system as well to be retrieved at any time.\nWhenever there is lease vehicle delivery, you do this delivery through a mobile app. You get the customer acknowledgment signature on the mobile app. The system will email Lease Vehicle Delivery Note to the customer & CC to you. This delivery note is stored in the system, which can be retrieved at any time.\nWhenever there is a lease vehicle service due, you can do the vehicle replacement through the mobile app.\nWhenever there is vehicle checkout & check-in at any point during the lease cycle, you inspect the vehicle through the mobile app.\nWhenever there is a customer signature requirement at any point during the lease cycle, you get customer signatures electronically either through a digital signature pad or through the mobile app.\nAll customer documents are electronically stored in a system that can be retrieved at any time like:\nNational ID\nPassport\nDriving License\nAll corporate customer documents are electronically stored in the system like:\nTrade License\nCredit Approval Document\nChamber of Commerce Document\nAll sales orders (customer’s POs) are electronically stored in the system, used as supporting documents on lease invoice email.\nAll vehicles documents are electronically stored in the system like:\nVehicle Registration Card\nVehicle Insurance Policy\nAbove are some examples of paperless leasing operations. Speed – Vehicle Leasing Software (VLS) enables you to run paperless leasing operations entirely.\nStart 30 Days Free Trial"}, {"id": "S175", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software Features", "url": "https://speedautosystems.com/vehicle-leasing-software/features/", "path": "pages/d04e090ea07efc01.html", "text": "Get Started Now\nComprehensive Vehicle Leasing ERP\nSpeed Vehicle Leasing Software (VLS)\nHome\n»\nSpeed Vehicle Leasing Software\n»\nFeatures\nSpeed Vehicle Leasing Software (VLS)\nSpeed Vehicle Leasing Software (VLS) Features\nLease Setup\nLease Cost Parameters Setup:\nDepreciation\nInsurance Cost\nRegistration Cost\nFinance Cost\nMaintenance Cost etc\nLease Cost Setup Vehicle-wise\nLease Inquiries Management\nLease Quotation Module\nLease Quotation Preparation\nLease Quotation Customer Approval\nLease Quotation Revision\nReports\nApproved Lease Quotations\nRejected Lease Quotations\nPending Lease Quotations\nLease Tariff\nMaster Lease Agreement\nCustomer Approved Quotation/Sa mages History\nCreate and manage Service Items\nHow to define Services\nHow to manage Service Log\nHow to Download/Process Fines\nHow to Download/Process Tolls\nManage Lease Particulars\nHow to define and adjust Tariff\nHow to set Cost Parameters\nHow to manage Cost Settings\nHow to manage Lease Inquiries\nDefine and handle Quotations\nManage Master Agreements\nHow to define and manage Agreements\nDefine and manage Clauses of lease agreements"}, {"id": "S177", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Asset", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/assets/", "path": "pages/00727556f596cea0.html", "text": "Assets\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on Assets module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nAssets Data will be imported automatically.\nYou can also download sample Assets Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S178", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Companies", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/companies/", "path": "pages/fd07b7c2d0946729.html", "text": "Companies\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Companies module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nCompanies Data will be imported automatically.\nYou can also download Sample Companies Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S179", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Create and manage Service Items", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/create-and-manage-service-items/", "path": "pages/67afaf0db7d3d24f.html", "text": "Create and manage Service Items\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Service Items module.\nNow, click on the +CREATE NEW SERVICE ITEM button.\nA pop-up window will appear. Put the service item name and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S180", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Create and manage vehicle types", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/create-and-manage-vehicle-types/", "path": "pages/1f35d2d870b3ff1d.html", "text": "Create and manage vehicle types\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Vehicle Types module.\nA window will open. Go the +CREATE NEW VEHICLE TYPE button and click on it.\nA form will appear. Fill it and add specify diagrams. Then, click on the SAVE button. All vehicles will be listed with name and details.\nYou can also search here any vehicle by typing vehicle type. To view, edit, or delete, click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S181", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Data Import Management", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/data-import-management/", "path": "pages/cac2f4cb56a898d0.html", "text": "Data Import Management\nData Import module allows you to import (or export) data from (or to) your system. For this purpose, the Data Import module is further divided into sub-modules."}, {"id": "S182", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Define and handle Quotations", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/define-and-handle-quotations/", "path": "pages/c555b4b275c5325e.html", "text": "Define and handle Quotations\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Quotations module.\nClick on the +CREATE NEW LEASE QUOTATION button.\nA form will appear. Here put the date, customer name, contact person (if customer is a company), and then enter the vehicle details. If you want to add more than one vehicle for a single customer, click om the Add Row option below every vehicle detail. Also specify rate/month for each year as per demand.\nNow, click on the SAVE button.\nAll quotations will appear as a list in the window.\nYou can view, edit, or delete by clicking on the ACTIONS button.\nIf you have to search a specific quotation, put lease quotation number or customer name, internal approval status, customer approval status, and/or date. Then, click on the REFRESH button.\nClick HERE if you have a query or an issue."}, {"id": "S183", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Define and manage Clauses of lease agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/define-and-manage-clauses-of-lease-agreements/", "path": "pages/1ae9800c677d6c4c.html", "text": "Define and manage Clauses of lease agreements\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Clauses module.\nClick on the +CREATE NEW CLAUSE TYPE button.\nA new window will be opened. Specify a name and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S184", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Define and manage staff Designations", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/define-and-manage-staff-designations/", "path": "pages/699ad1d1154e7b64.html", "text": "Define and manage staff Designations\nGo to the panel on the left side and click on the Staff tab.\nScroll down and click on the Designations module. A window will open.\nA window will open. Go the +CREATE NEW DESIGNATION button and click on it.\nA new small window will pop-up. Write the designation name here and click on the SAVE button. New designation will be available in the list.\nYou can view, edit, or delete by clicking the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S185", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to add a new Staff member", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-add-a-new-staff-member/", "path": "pages/a25e3adc14c0c3da.html", "text": "How to add a new Staff member\nGo to the panel on the left side and click on the Staff tab.\nScroll down and click on the Staff module. A window will be opened.\nGo to the top-right side of the window and click on the +CREATE NEW STAFF button.\nA form will appear. Fill the details and add essential documents. Then, click on the SAVE button.\nStaff members will be enlisted. You can view, edit, or delete by clicking on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S186", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to add a new Vehicle", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-add-a-new-vehicle/", "path": "pages/0cf516d2ee7eaa3d.html", "text": "Fleet module let you manage your vehicle easily and effectively.\nHow to add a new Vehicle\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Vehicles module.\nA window will open. Go the +CREATE NEW VEHICLE button and click on it.\nA form will appear. Fill it and add documents if needed. Then, click on the SAVE button. All vehicles will be listed with details like make, model, type, and status, etc.\nYou can also search here any vehicle by typing plate no, fleet no, make and model, or any other prescribed detail.\nClick HERE if you have a query or an issue."}, {"id": "S187", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to add or remove agreement fields", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-add-or-remove-agreement-fields/", "path": "pages/54774aef338a2d6d.html", "text": "How to add or remove agreement fields\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Fields tab.\nCheck or unchecked boxes according to your business and agreement needs.\nClick HERE if you have a query or an issue."}, {"id": "S188", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to add or remove documents required in leasing agreement", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-add-or-remove-documents-required-in-leasing-agreement/", "path": "pages/99001fe2fc92fe7b.html", "text": "How to add or remove documents required in leasing agreement?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Agreement Documents tab.\nSome default options of Agreement Documents will appear in a windows.\nClick on the Add Row option given in the below left side of the Agreement Documents list.\nA new row will appear. Now, choose Agreement Documents type and click on the SAVE button.\nYou can change the order of the list by clicking and holding long on the grey area of a row. Drag the row and release it where you want to place.\nTo delete a row, click on the cross shown in red color tab in every row.\nClick HERE if you have a query or an issue."}, {"id": "S189", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to adjust charges for leasing agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-adjust-charges-for-leasing-agreements/", "path": "pages/d830fa77cce5ec65.html", "text": "How to adjust charges for leasing agreements\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Charges tab.\nSelect module either Rental or Leasing.\nSome default options of charges will appear in a windows.\nClick on the Add Row option given in the below left side of the charges list.\nA new row will appear. Now, choose charges type by clicking on the arrow depicted in the row. Choose further parameter and click on the SAVE button.\nYou can change the order of the list by clicking and holding long on the grey area of a row. Drag the row and release it where you want to place.\nTo delete a row, click on the cross shown in red color tab in every row.\nClick HERE if you have a query or an issue"}, {"id": "S190", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to adjust companies as customers", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-adjust-companies-as-customers/", "path": "pages/86c9ded6d4a95b3e.html", "text": "How to adjust companies as customers\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Companies module. A window will open.\nClick on the +CREATE NEW COMPANY button.\nA form will appear. Fill the details, add documents, billing information, and drivers’ details. Then, click on the SAVE button.\nA company will appear in a listed format.\nTo view, edit, or delete, click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S191", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to adjust the date, time, and time zone", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-adjust-the-date-time-and-time-zone/", "path": "pages/7c8a95697f4a79eb.html", "text": "How to adjust the date, time, and time zone?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nHere you will see slots for Time Zone and Date Format. Adjust them accordingly.\nScroll down and click on the SAVE button in the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S192", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to adjust VAT settings", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-adjust-vat-settings/", "path": "pages/d3dc0ffacba74722.html", "text": "How to adjust VAT settings?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nScroll a little down and here you will see slots for VAT Percentage and VAT Inclusive and Is VAT Optional. Adjust them accordingly.\nScroll down and click on the SAVE button at the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S193", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to change the Voucher number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-change-the-voucher-number/", "path": "pages/439895c17fa0b9f5.html", "text": "How to change the Voucher number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Change Voucher No. module.\nA dashboard will appear on the right side of the panel. Select the voucher type, put the current voucher number, and new voucher number.\nClick on the CHANGE button.\nClick HERE if you have a query or an issue"}, {"id": "S194", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to correct Vehicle Status", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-correct-vehicle-status/", "path": "pages/8fe0a465c6f6b417.html", "text": "How to correct Vehicle Status?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Correct Vehicle Status module.\nA dashboard will appear on the right side of the panel. Select a vehicle here.\nClick on the CONVERT button.\nClick HERE if you have a query or an issue."}, {"id": "S195", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create a new Language", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-a-new-language/", "path": "pages/676e6bdff1bd4684.html", "text": "How to create a new Language?\nIf you didn’t find your language in the given list, then follow the below process.\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Languages module.\nA dashboard will appear on the right side of the panel. Click on the +CREATE NEW LANGUAGE button.\nChoose language and flag. Then, click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S196", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create an office branch in Speed – VLS", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-an-office-branch-in-speed-vls/", "path": "pages/22afbc93eda9ae91.html", "text": "How to create an office branch in Speed – VLS?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Branches module.\nA dashboard will appear on the right side of the panel. Now, go for the +CREATE NEW BRANCH button on the top right side of the dashboard, click on it.\nA form will open. Fill the form with Branch Code, Branch Name, TRN (Tax Return Number), and State and click on the SAVE button.\nA newly created branch will appear on the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S197", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create and manage a checklist", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-and-manage-a-checklist/", "path": "pages/75148733bf2eacf4.html", "text": "How to create and manage a checklist?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Checklist module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW CHECKLIST ITEM” button.\nFill the form and click on the SAVE button.\nIf you want to Edit/Delete any checklist item, click on the ACTIONS button accompanies with the checklist item on the dashboard and edit/delete accordingly.\nClick HERE if you have a query or an issue."}, {"id": "S198", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create and manage Email SMTP", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-and-manage-email-smtp/", "path": "pages/718afe992e54d4c3.html", "text": "How to create and manage Email SMTP\nTo setup Gmail SMTP account, you need to follow the below given steps.\nSign-in your Gmail account, go to profile and click on the “Manage your Google Account” tab.\nGo to the panel on LEFT side and click on “Security” tab.\nGo to the panel on LEFT side and click on “Security” tab.\nGo to the bottom right side and click on “GET STARTED.”\nHere you have to put your password.\nSelect your country and write your valid phone number.\nSelect whether you want to receive code via “Text message” or “Phone call.”\nClick on “NEXT” tab.\nYou will receive a code on your phone number. Put that code here and click on “NEXT” tab.\nNow, click on the “TURN ON” tab.\nNow, go back to the account home page.\nClick on “Security” tab.\nClick on “App passwords.”\nYou will have to put your password again.\nClick on “Select app” and then select “Other (Custom name).”\nSelect your name and click on generate.\nA mini window will appear with password on yellow strap. Copy and save this password.\nNow, go to your account in app.speedautosystems.com and fill the form.\nWrite your Gmail address.\nChoose your business’s name\nSMTP host: smtp.gmail.com\nSMTP Port: 25\nCheck the “Use SSL” box.\nIn the end, after putting username, paste the password that you had copied in Last step. Then, click on the “SAVE” button. Now, send a test email and check whether the SMTP is working aptly."}, {"id": "S199", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create and manage fines", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-and-manage-fines/", "path": "pages/917891a5520d9e09.html", "text": "How to create and manage fines\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Fines tab.\nClick on the +CREATE NEW TARIFF FILE button. And fill the details. Then, click on SAVE button.\nFines Account will appear enlisted in a window.\nTo view, edit, or delete a Fines Account click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S200", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create and manage Suppliers", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-and-manage-suppliers/", "path": "pages/76ed74d943282b4c.html", "text": "How to create and manage Suppliers\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Suppliers module. A window will open.\nClick on the +CREATE NEW SUPPLIER button.\nA form will appear. Fill the details and click on the SAVE button.\nSuppliers will appear in a listed format.\nTo view, edit, or delete, click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S201", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create and manage tolls", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-and-manage-tolls/", "path": "pages/410aec7298c06967.html", "text": ""}, {"id": "S202", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to create Contact Groups", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-create-contact-groups/", "path": "pages/acbeed25324ded5b.html", "text": "How to create Contact Groups?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Contact Groups module.\nA dashboard will appear on the right side of the panel. Go to the “Type” and choose either Customer or Supplier.\nNow, click on the “+” button given on the top-right side, fill the form, and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S203", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Agreement Number & Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-agreement-number-code/", "path": "pages/115f3a9b1430a0f9.html", "text": "How to define Agreement Number & Code?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nAdjust Agreement Number and Codes.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S204", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Amortization Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-amortization-number/", "path": "pages/e95faf8f47a1a00a.html", "text": "How to define Amortization Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Amortization Number & Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S205", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define and adjust Tariff", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-and-adjust-tariff/", "path": "pages/6ad680cb0d65bf54.html", "text": "Manage Lease Particulars\nThe lease module lets you manage all the lease processes.\nHow to define and adjust Tariff\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Tariff module.\nSelect a date range and click on the PROCESS button. No of processed fines in total and with agreements will appear.\nYou can download this data by clicking on the DOWNLOAD button integrated on the top-right side of the window.\nClick HERE if you have a query or an issue."}, {"id": "S206", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define and manage Agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-and-manage-agreements/", "path": "pages/335c15e9155b8f39.html", "text": "How to define and manage Agreements\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Agreements module.\nClick on the +OPEN NEW LEASE AGREEMENT button.\nA new window will be opened. Fill details, provisions, clauses, and pre-termination instruction. Then, click on the SAVE button.\nAll agreements appear in the window as listed.\nYou can also export the data to excel by clicking on the EXPORT TO EXCEL button or take print by clicking on the REPORT button.\nBy clicking on the blue ACTIONS button, you can perform a vast set of actions.\nClick HERE if you have a query or an issue."}, {"id": "S207", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define and manage Roles", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-and-manage-roles/", "path": "pages/15bde504784a1cd4.html", "text": "How to define and manage Roles?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Roles module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW ROLE” button.\nClick on the SAVE button.\nClick on the ACTIONS button if you want to edit a Role.\nClick HERE if you have a query or an issue."}, {"id": "S208", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Bill Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-bill-number-2/", "path": "pages/0159e19554ed0d70.html", "text": "How to define Bill Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Bill Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S210", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Booking Number & Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-booking-number-code/", "path": "pages/3bb6152dbc8565cc.html", "text": "How to define Booking Number & Code?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nAdjust Booking Number and Codes.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S211", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Cancel Cheque Payable Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-cancel-cheque-payable-number/", "path": "pages/306d6b163ad8c526.html", "text": "How to define Cancel Cheque Payable Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Cancel Cheque Payable Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue"}, {"id": "S212", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Card Transaction Bank Transfer Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-card-transaction-bank-transfer-number/", "path": "pages/d0bce92140bd6076.html", "text": "How to define Card Transaction Bank Transfer Number\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Card Transaction Bank Transfer Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S213", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Charts of Accounts-account Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-charts-of-accounts-account-code/", "path": "pages/d2614801f4a08159.html", "text": "How to define Charts of Accounts-account Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Charts of Accounts-account Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S214", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Customer Deposit Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-customer-deposit-number/", "path": "pages/ae3aca7d67cfc211.html", "text": "How to define Customer Deposit Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Customer Deposit Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S215", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Customers Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-customers-code/", "path": "pages/59ca40e3c3b6609d.html", "text": "How to define Customers Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Customers Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S216", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Debit Note Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-debit-note-number/", "path": "pages/568508a6fc5d3c15.html", "text": "How to define Debit Note Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Debit Note Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S217", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Depreciation Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-depreciation-number/", "path": "pages/f2df8c28853b56c7.html", "text": "How to define Depreciation Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Depreciation Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S218", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Invoice Number & Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-invoice-number-code/", "path": "pages/000f2652fcf01a9e.html", "text": "How to define Invoice Number & Code?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down and adjust Invoice Number and Codes.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S219", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define JV Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-jv-number/", "path": "pages/995212f4fa473432.html", "text": "How to define JV Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust JV Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S220", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Lease Inquiry Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-lease-inquiry-code/", "path": "pages/81e9d03556b4f363.html", "text": "How to define Lease Inquiry Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Lease Inquiry Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S221", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Lease Master Agreement Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-lease-master-agreement-number/", "path": "pages/8c7d0043d2c0a5ff.html", "text": "How to define Lease Master Agreement Number\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Master Agreement Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S222", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Lease Quotation Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-lease-quotation-code/", "path": "pages/ec4ae78bcbccc986.html", "text": "How to define Lease Quotation Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Lease Quotation Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S223", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Mature Cheque Payable Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-mature-cheque-payable-number/", "path": "pages/7a9933adb11ade64.html", "text": "How to define Mature Cheque Payable Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Mature Cheque Payable Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S224", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Mature Cheque Receivable Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-mature-cheque-receivable-number/", "path": "pages/0255d1ca5baf595b.html", "text": "How to define Mature Cheque Receivable Number\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Mature Cheque Receivable Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S225", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define monthly Invoicing and Lease Invoicing", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-monthly-invoicing-and-lease-invoicing/", "path": "pages/e8fbd152b6f71409.html", "text": "How to define monthly Invoicing and Lease Invoicing?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nScroll a little down and you will see the heading of Monthly Invoicing and Lease Invoicing. Adjust figures as per your business and fleet requirements.\nScroll down and click on the SAVE button at the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S226", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Purchase Order Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-purchase-order-number/", "path": "pages/90f79f6615d9ee08.html", "text": "How to define Purchase Order Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and Purchase Order Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S227", "product": "vehicle-leasing-software", "kind": "user-guide"
