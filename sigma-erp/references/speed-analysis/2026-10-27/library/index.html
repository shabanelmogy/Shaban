ss to all the updated data of that particular vehicle.\nCodes are easy to generate and feasible to use.\nYou have two options; past the code either on keyring or door of the vehicle.\nYou need not search your vehicle among thousands of cars.\nQR code will eliminate the use of vehicle number, registration number or any other long-form and time taking method to search a vehicle.\nThe all-in-one facility will allow you to just scan the code and get A-Z details of the vehicle.\nYou can generate QR codes easily and at any time with any technical knowledge.\nCRS App is totally compatible to scan and instantly provide you details.\nNo paper working or time taking activities to access the details of a car.\nStart 30 Days Free Trial"}, {"id": "S020", "product": "car-rental-software", "kind": "product-reference", "title": "Increase Your Sale By Optimizing Fleet", "url": "https://speedautosystems.com/car-rental-software/benefits/revenue-booster-increase-your-sale-by-optimizing-fleet-utilization/", "path": "pages/1a313ca9a4df4127.html", "text": "Speed Car Rental Software (CRS) Benefits\nHome\n»\nSpeed Car Rental Software (CRS) | Auto Rental System\n»\nBenefits\n»\nRevenue Booster – Increase Your Sale By Optimizing Fleet Utilization\nIncrease Your Sales by Optimizing Fleet Utilization with Car Rental Software\nBoosting sales isn’t rocket science; it’s all about choosing the right processes and operations. In the car rental business, effective fleet management software can make a significant difference. Speed Auto Systems equips you with powerful tools to enhance your sales capabilities.\nFleet Utilization Optimization\nFleet utilization is crucial for measuring sales effectiveness. It’s calculated based on the ratio of idle vehicles to those currently rented out.\nFor example, if you have 1000 cars in your fleet and 900 are rented out at a given time, your fleet utilization rate would be: Fleet Utilization Rate = 900 / 1000 = 90%\nOptimizing fleet utilization means minimizing id ously\nTracking and analysing your bookings and getting important insights for reservations and transactions\nFinding a perfect solution with all the above-mentioned attributes would be a hard nut to crack. However, we provide world-class software intending to improve your brand building, cost-effectiveness, and simplifying the processes.\nWe Are Revolutionary!\nWe Go Extra Mile For You\nYes, we go the extra mile when it comes to your satisfaction. Being a medium size car rental company, you have to manage some spare tasks as well. These chores may include finance, human resource management, and even sales & marketing automation.\nThat’s why we offer some advanced products that are easily integrable and manageable. So, you can incorporate car rental software with other tools like:\nSpeed – ERP (Enterprise Resource Planning System)\nSpeed – HRM (Human Resource Management System)\nSpeed – CRM (Customer Relationships Management System)\nGet On Your Highroad To Success\nWhen you are using Speed – the car rental system, it will ultimately boost your corporate performance. You will be able to:\nRecognize Non-Revenue Movements or unauthorized trips immediately\nEstimate the fuel usage precisely and then charge accordingly\nIdentify the vehicle damage or loss of accessories instantly\nGreet your customers by name and other particulars\nReceive real-time check-in/check-out alerts\nStart 30 Days Free Trial\nLet’s get you Started\nIf you want to know more about Speed Car Rental System (CRS) Enterprise Edition, let’s get connected.\nGet in Touch"}, {"id": "S031", "product": "car-rental-software", "kind": "product-reference", "title": "Speed Car Rental Software - Rental Contract Extension", "url": "https://speedautosystems.com/car-rental-software/for-medium-size-car-rentals/rental-contract-extension/", "path": "pages/0a587964e2983603.html", "text": "List\nList\nMenu\nSetup\nCompany Detail\nControl Panel\nDepartments\nBranches\nUser Group with System Access Rights\nApplication Us -even point(BEP) in your business.\nSay No To Server And VPN\nGone are the days when the server and VPN were the gods of the arena. Nowadays, cloud and mobile-based systems are operating everywhere. Therefore, you shouldn’t buy a server-based solution that will cost you not only in terms of money but the time and resources as well. Also, you have to hire some technical experts to maintain the system and operations.\nOn the other hand, if you have branches or franchises of your nascent business, you have to connect them with the help of some routers or VPN. This again will cost you.\nSo, it would be better to hire a cloud-based car rental software. We, at Speed Auto Systems, offer cloud-based, efficient, and world-class solutions. Additionally, we aim to put each dollar into your pocket by providing you a cost-effective car rental management software.\nSmall Monthly Subscription\nStarting from 50 $ monthly subscription is really value for money.\nStart 30 Days Free Trial\nLet’s get you Started\nIf you want to know more about Speed Car Rental System (CRS)\nfor Small Car Rentals, let’s get connected.\nGet in Touch"}, {"id": "S034", "product": "car-rental-software", "kind": "product-reference", "title": "Speed Car Rental Software - Rental Cancelled Agreements Report", "url": "https://speedautosystems.com/car-rental-software/for-small-car-rentals/rental-cancelled-agreements-report/", "path": "pages/29e33b70f347bcd3.html", "text": "List\nList\nMenu\nSetup\nCompany Detail\nControl Panel\nEmployees\nUser Group with System Access Rights\nApplication Users\nChange Password\nChange System Background\nDB Connection Info\nKarzansoft\nAbout System\nLog Off\nExit\nCustomers\nWalk-in Customers (Cash Customers)\nCorporate Customers (Credit Customers)\nSearch Customer\nStatement Of Account (Customer)\nContact Balances\nVehicles\nVehicles Master\nMake\nModel\nVehicle Engine Capacity\nService Types (Preventive Maintenance)\nDefect Types (Incidental Maintenance)\nManage Vehicles\nDe-Fle lication Users Rights Management\nDeactivating Application User\nDefining Vehicle Types\nManaging Vehicles\nAdding Vehicles\nUpdating Vehicles\nDeleting Vehicles\nVehicles Documents Management\nVehicles QR Codes Generation\nDefining Rental Tariff\nRental Discounts Management\nCustomers Management\nIndividual Customer Management\nCreating Individual Customer Account\nUploading Individual Customer Documents\nBilling Settings of Individual Customer Account\nEditing Individual Customer Account\nDeleting Individual Customer Account\nCompany Customer Account Management\nCreating Company Customer Account\nUploading Company Documents\nEditing Company Customer Account\nBilling Settings of Company Account\nRental Bookings Management\nRental Planner\nRental Agreements Management\nRental Agreement Opening\nRental Agreement Printing\nElectronic Rental Agreement with Signature on Signature Pad\nElectronic Rental Agreement using Speed – Car Rental Software Mobile App with Signature on Mobile\nRental Agreement Editing\nRental Agreement Advance Amount Handling\nRental Agreement Deposit Management\nVehicle Replacement on a rental agreement\nDriver Replacement on a rental agreement\nRental Agreement Extension\nRental Agreement Cut-short\nRental Agreement Log\nRental Agreement Invoicing\nDaily Rental Agreement Invoicing\nMonthly Rental Agreement Invoicing\nRental Agreement Receipts\nRental Agreement Advance Receipt\nRental Agreement Final Settlement Receipt\nCustomer Statement of Account\nCustomer Statement of Account Emailing\nCustomers Balance Summary"}, {"id": "S038", "product": "car-rental-software", "kind": "user-guide", "title": "Managing Vehicles", "url": "https://speedautosystems.com/car-rental-software/user-guide/adding-vehicles/", "path": "pages/cb80afb9e49b1509.html", "text": "Adding Vehicles\nSelect the fleet module from the left navigation panel.\nClick on the vehicles tab.\nIn this window you will see a blue button on the right upper corner named “Create New Vehicle”.\nWhen you press that button a window pop up will appear.\nIn this pop up you have to mention each and every detail of that specific car accordingly.\nPlate no. is a unique as it cant be repeated and make and model of the vehicles are already entered just enter the initials and it will appear in the system."}, {"id": "S039", "product": "car-rental-software", "kind": "user-guide", "title": "Application Users Rights Management", "url": "https://speedautosystems.com/car-rental-software/user-guide/application-users-rights-management/", "path": "pages/b256d007d8bf4ea6.html", "text": "Application Users Rights Management – Car Rental Software Web App\nAfter creating a user now you have to provide the acces to the user and from the pop up in the new user window there is an option of roles. Open that role and assign the specific role that you created for the user. You can create multiple roles with diffrent access to the system. These roles can only be created by the admin."}, {"id": "S040", "product": "car-rental-software", "kind": "user-guide", "title": "Billing Settings of Company Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/billing-settings-of-company-account/", "path": "pages/42baeb6750fc0b76.html", "text": "Billing Settings of Company Account\nOpen the companies module from the left navigation panel.\nClick on the second tab for Companies.\nClick on the blue button stating “Create New Company”\nA pop up will appear and go to the last tab from top stating “Billing Info”.\n1. Here you have to define Credit Period of company that how much long the credit account can be hold.\n2. You have to select the limit for Company credit in the Credit Limit.\n3. YOu can add the company in Tax Return Number in TRN.\n4. Enter the credit card details if the company provides."}, {"id": "S041", "product": "car-rental-software", "kind": "user-guide", "title": "Billing Settings of Individual Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/billing-settings-of-individual-customer-account/", "path": "pages/66ab2d94a5cc6b44.html", "text": "Billing Settings of Individual Customer Account\nOpen the customer module from the left navigation panel.\nClick on the first tab for individual customers.\nClick on the blue button stating “Create New Individual”\nA pop up will appear and go to the last tab from top stating “Billing Info”.\n1. Here you have to define Credit Period of customer that how much long the credit account can be hold.\n2. You have to select the limit for customer credit in the Credit Limit.\n3. If customer is a tax payment then you can add the customer Tax Return Number in TRN.\n4. If the Customer is tax exempted then select the option and tax will not be applied on that individual.\n5. At last you can enter the Credit or Debit card information for that specific customer."}, {"id": "S042", "product": "car-rental-software", "kind": "user-guide", "title": "Email Sending Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/charges/", "path": "pages/c04140ccb6667f79.html", "text": "Charges – Car Rental Software Web App\nCharges:\nThis option is related to the charges types that are define in the system.\nFirst option, select the Module for which you are entering the charges.\nUnderneath you will find a box in which first Column shows you the types of charges.\nSecond column is about the rate type that how are you going to charge it on per day or one time or per KM.\nThird Column Named as Only For closing is the option if you check it then system will only charge or give the option to charge only when the agreement is closing.\nFourth column represents the mandatory field if you check the boxes in front of charges under mandatory then without entering those charges system will not allow you to proceed further.\nFifth columns represents the taxable things and if you will check the boxes then that type of charge will be taxable like for fuel it’s not taxable so you leave it blank."}, {"id": "S043", "product": "car-rental-software", "kind": "user-guide", "title": "Creating Company Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/creating-company-customer-account/", "path": "pages/c5c9c83801da7abd.html", "text": "Watch source video online\nCreating Company Customer Account\ng .Click “Customers” link in left navigation panel\nh. Click “Companies”\ni. On right side you will see the grid containing the Companies accounts\nj. Click the button “+Create New Company” on right top corner to create new company account.\nk. Form will appear to create the account of the company\nI. Company Name is compulsory without which Save button will not be enabled for saving.\nm. Documents Management (Trade License)\na. Click the “Documents” Tab then Click the “Add” button\nb. After selecting “Trade License”, enter the details of trade license\nc. Attach trade license pictures by clicking the “Camera” button\nn. Billing Info\ni. Click the Billing Info Tab\nii. Enter the credit period & credit limit.\niii. Enter tax id in “Tax Id” field\nvi. For monthly invoicing, select one of the invoicing rules:\nMonthly invoicing on month end. It is the most commonly used method for monthly invoicing to companies.\nDate to Date Monthly invoicing will be on the basis of calendar month like if the monthly rental agreement is opened on 18 Jan then invoices will be 18 Jan – 17 Feb, 18 Feb – 17 Mar, 18 Mar – 17 Apr and so on.\nMonthly invoicing on the basis of each 30 days\nv. For monthly invoicing, select one of the invoice types\nAdvance Invoicing\nPost (Credit) Invoicing.\nv. Enter Toll Surcharge\nvi. Enter Fine Surcharge\nviii. Enter Fine Surcharge type “Fixed” or “Percentage” of the fine amount\nix. Select the checkbox “Tax Applicable” else uncheck if the company is Tax exempted"}, {"id": "S044", "product": "car-rental-software", "kind": "user-guide", "title": "Creating Individual Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/creating-individual-customer-account/", "path": "pages/b17e08451c95207b.html", "text": "Watch source video online\nCreating an Individual Customer Account\nClick the “Customers” link in the left navigation panel\nClick “Individuals”\nOn the right side, you will see the grid containing the individual customer accounts\nClick the button “+Create New Individual” on the right top corner to create a new individual customer account.\ne. a form will appear to create the account of individual customer\nf. First Name, Last Name & Mobile No fields are compulsory without which Save button will not be enabled for saving.\ng. Documents Management (Driving License, National ID, Passport details along with images)\ni. Click the “Documents” Tab then Click the “Add” button\nii. Click the document type which you want to enter like Driving License, National ID, Passport or any Other Document\niii. After selecting “Driving License”, enter the details of driving license\niv. Attach driving license pictures (front & back) by clicking the “Camera” button\nh. Billing Info\ni. Click the Billing Info Tab\nii. Mostly individual customers have no credit facility. Credit period & credit limit will remain 0.\niii. Enter individual customer tax id in “Tax Id” field\niv. For monthly invoicing, select one of the invoicing rules:\na. Date to Date Monthly invoicing will be on the basis of calendar month like if the monthly rental agreement is opened on 18 Jan then invoices will be 18 Jan – 17 Feb, 18 Feb – 17 Mar, 18 Mar – 17 Apr and so on.\nb. Monthly invoicing on month-end\nc. Monthly invoicing on the basis of each 30 days\nv. For monthly invoicing, select one of the invoice types\na. Advance Invoicing\nb. Post (Credit) Invoicing\nvi. Enter Toll Surcharge\nvii. Enter Fine Surcharge\nviii. Enter Fine Surcharge type “Fixed” or “Percentage” of the fine amount\nix. Select the checkbox “Tax Applicable” else uncheck if the customer is Tax exempted"}, {"id": "S045", "product": "car-rental-software", "kind": "user-guide", "title": "Currency Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/currency-settings/", "path": "pages/2b0e2e0766b35350.html", "text": "Watch source video online\nCurrency Settings\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab.\nClick on the Common tab and select Currency Code e.g AED for UAE Dirham, Currency Name e.g Dirham is Dubai Currency name, and Decimal Currency Name e.g Fil for Dirham."}, {"id": "S046", "product": "car-rental-software", "kind": "user-guide", "title": "Young or New Driver Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/customer-statement-of-account-emailing/", "path": "pages/c8e3ca1440652872.html", "text": "Young or New Driver Settings\nYoung New Driver :\nIf your car rental charge extra for the new or young drivers then you can select this option, otherwise leave it blank.\nFirst option is about the experience of driving and you have to enter the no. of years, e.g Less than 2 years etc..\nSecond option is about the age of the driver in this option you have to decide that less than this age of customer is considered to be a young driver. e.g 20 years of age is knows as a young driver."}, {"id": "S047", "product": "car-rental-software", "kind": "user-guide", "title": "Customer Statement of Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/customer-statement-of-account/", "path": "pages/ac01c204ce41b63f.html", "text": "Customer Statement of Account\nGo to the customers module from left navigation panel and open “Statement Of Account”\nHere you have to select the date range first and after that the customer name or the company name and press search button.\nWe have 2 options under it:\n1. Ledger Report: This will show you the every transaction related to that individual or the company. All the agreement and invoices and deposits will come here. It will also show you that is there any Debit or Credit remaining to that contact or is everything is balanced with that particular.\n2. Outstanding Invoices: Here you can see that how much pending amount is there with that particular contact. It will show you all the outstanding invoices."}, {"id": "S048", "product": "car-rental-software", "kind": "user-guide", "title": "Customer Balance Summary", "url": "https://speedautosystems.com/car-rental-software/user-guide/customers-balances-summary/", "path": "pages/d760bfb9524bf38e.html", "text": "Customers Balance Summary\nGo to the customers module from left navigation panel and open “Balance Summary”\nHere you have to select the date range and all the remaining balances will come here.\nWe have 3 options here:\n1. ALL: In all it shows you the complete data of all the Debit’s and Credit’s in the system with the customer information,\n2. With Debit Balance: It show’s you all the customers with the debit balance to the system. According to our system the Debit Balance shows the amount and customers to whom we have to pay.\n3. With Credit Balance: It show’s you all the customers with Credit balance. If there are some entries in this option then it means we have to charge it from the customer. These are the pending balance."}, {"id": "S049", "product": "car-rental-software", "kind": "user-guide", "title": "Daily Rental Agreement Invoicing", "url": "https://speedautosystems.com/car-rental-software/user-guide/daily-rental-agreement-invoicing/", "path": "pages/3bae9d87f378e06d.html", "text": "Daily Rental Agreement Invoicing\nGo to the Vouchers from left navigation panel and select invoices.\nHere you will see all the invoices which are opened or closed.\nTo generate a new invoice click on the blue button on the top right corner stating Generate Invoices.\nIt will give you 3 options like:\na. Rental\nb. Fines\nc. Miscellaneous\nFor rental agreement we will select the rental option and a new window popup will appear.\nIf you enter the agreement number or customer number then the related invoice will come under other wise if you only select the date and all the pending invoices will be available under it.\nSelect the corresponding invoice and press the generate button and the invoice will be generated.\nDaily invoice are generated when the agreement is closed for complete amount."}, {"id": "S050", "product": "car-rental-software", "kind": "user-guide", "title": "Date Format Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/date-format-setting/", "path": "pages/8b5f13fb9cc097c7.html", "text": "Watch source video online\nDate Format Settings\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab.\nClick on the Common tab and select Date Format.\nSelect the Date Format according to your region and use “/” in between. E.g DD/MM/YYYY."}, {"id": "S051", "product": "car-rental-software", "kind": "user-guide", "title": "Deactivating Application User", "url": "https://speedautosystems.com/car-rental-software/user-guide/deactivating-application-user/", "path": "pages/3e8dd1ec4d095f3b.html", "text": "Deactivating Application User\nDeactivating Application User:\nThis option is to delete or deactivate the user from the system.\na. Click on the Action button with the user.\nb. Select delete and the system will ask for confirmation then press “YES”.\nthe user will now be restricted and will not be able to acces the system."}, {"id": "S052", "product": "car-rental-software", "kind": "user-guide", "title": "Defining Rental Tarif", "url": "https://speedautosystems.com/car-rental-software/user-guide/defining-rental-tarif/", "path": "pages/3d61e5a6b0c8e70a.html", "text": "Defining Rental Tarif\nOpen the rental option from the left navigation panel.\nHere you will find the first tab of Tariff click on it.\nAll the vehicle types that you created will be under it and you have to define the tariff for each and every vehile group.\nThere is small blue button with every vehicle group name. When you click on that a new window pops up and you have to define the tariff here:\n1. You have to select the type whether its daily or weekly or monthly select that.\n2. Second tab is about the diffrent option for the same tariff.\n3. Now you have to select the days ranges from 0 till the number of days you want to charge how much for these days.\na, You can define diffrent rate for diffrent days.\nb, It is charged on daily basis.\nc, Last column is about the young driver rate if you charge extra from young driver then enter the value otherwise leave it blank.\n4. If you charge on hourly basis then enter that data over here.\n5. Half day pricing for half day rent and you cna add it in the same order.\n6. In the second tab there is a second option for Weekend Rental and when yu open that tab here you have to define if you charge extra on the weekends then enter the days and rates accordingly and you can select the hourly range from there.\n7. The third tab is about the protections or you can call it insurance. You can add per day rate from here for the insurances if you charge and you add multiple insurance from here.\n8. Fourth tab is for mileage if you charge on the basis of milleage or if there is a certain limit on milleage than add the limit in allowed and enter the per km rate in Excess option.\n9. the last option in rental tariff is about the extra things or services that you provide with the cars like (GPS, Baby Seat, Wifi or any other thing) you can add there rates from here and you can charge them accordingly."}, {"id": "S053", "product": "car-rental-software", "kind": "user-guide", "title": "Defining Vehicle Types", "url": "https://speedautosystems.com/car-rental-software/user-guide/defining-vehicle-types/", "path": "pages/d1c1ba789cfcb4bc.html", "text": "Defining Vehicle Types\nDefining Vehicle Types:\n1. To define a vehicle type you have to go the fleet module from the left navigation panel.\n2. Select Vehicle types.\n3. Click on the blue button on the right named as “Create New Vehicle Type”\n4. A pop up will appear now you have to enter the details of the vehicle type.\n5. Suppose its a Sedan Car. So the name will be Sedan.\n6. From Category you have to select the Category of the vehicle.\n7. Then you have to select the vehicle type accordinlgy from the drop down menu.\n8. Then from Acriss Trans Drive type you have specify the Transmission of the vehicle.\n9. Then you have to select that this cars runs on which technology.\n10. In the same pop up you will find the option of marking diagrams click on it.\n11. You will find all type of shapes of cars and you have to select accordingly so that whenever inspection appears that same diagram will be shown. for exterior and interior."}, {"id": "S054", "product": "car-rental-software", "kind": "user-guide", "title": "Deleting Individual Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/deleting-individual-customer-account/", "path": "pages/133614f2d2a8d2f6.html", "text": "Deleting Individual Customer Account\nOpen the customer module from the left navigation panel.\nClick on the first tab for individual customers.\nHere you can see there is an action button with the customers click on that action button and you will get option to delete the customer and customer will be deleted from the system."}, {"id": "S055", "product": "car-rental-software", "kind": "user-guide", "title": "Deleting Vehicles", "url": "https://speedautosystems.com/car-rental-software/user-guide/deleting-vehicles/", "path": "pages/a62f8cd4186571f3.html", "text": "Deleting Vehicles\nSelect the fleet module from the left navigation panel.\nClick on the fleet tab, and then on Vehicles.\nHere you will see the action button with every vehicle.\nWhen you click the action button a window pops up and there is the last option is for deleting the vehicle from the fleet.\n“If there are any aggrements made then system will not delete it you have to contact support for this”"}, {"id": "S056", "product": "car-rental-software", "kind": "user-guide", "title": "Your Company Letter Head Update", "url": "https://speedautosystems.com/car-rental-software/user-guide/document-number-format-settings/", "path": "pages/92424f397ccdecd8.html", "text": "Document Number Format Settings\nDocument Number Format Settings:\nThis option is related to the numbers and alphabets used in the system for different purposes like:\na. Agreements : If you want to add a manual number then simply click the first box. Otherwise select the boxes that you want to add to the agreement number e.g. Branch Code, Agreement Type Code, Year/Month (YYMM) and the numeric part. Then you have to assign the codes for Daily, Weekly and monthly for your easy understanding that by reading the code you can get the idea that what type of agreement it is.\nb. Booking : You have to define the format of booking no and the codes as you did for the Agreements.\nc. Invoice: You have to define how the invoice no will look so you can have a better understanding.\nd. Credit Note No: You have to define the credit note format and the prefix is used for easiness like for credit note you can write the prefix as (CN) so whenever you see a note you can easily identify that it is a credit note.\ne. Debit Note No: Same as the credit note and define the prefix.\nf. Reciept No: You have to define the format and prefix of the receipt number.\ng. Bill No: Define accordingly your business and it will be shown on every bill.\nh. Purchase Order No: If system generates the purchase number define it and it will be shown on the bill\ni. Sale Order No: While selling something you can have the idea of the date and month type of the order no.\nj. Payment No: If you have to payout something then set the format and it will be shown the same.\nk. Customer: You have to select IND for individuals and CMP for the company or any other related prefix for your understanding.\nl. Supplier: For suppliers you can use S or SUP.\nm. Staff: For staff you can use STF or anything that is easy for you to understand."}, {"id": "S057", "product": "car-rental-software", "kind": "user-guide", "title": "Downloading Speed – Car Rental Software iOS Mobile App", "url": "https://speedautosystems.com/car-rental-software/user-guide/downloading-speed-car-rental-software-ios-mobile-app/", "path": "pages/f5600de3c6cb29ee.html", "text": "Downloading Speed – Car Rental Software iOS Mobile App\nOpen Apple App Store on your iPhone or iPad.\nType in search box “Speed Car Rental Software”\nYou will find “Speed Car Rental Software (CRS)” mobile app. Install it.\nYou can download Speed – Car Rental Software iOS Mobile App by clicking the link https://itunes.apple.com/us/app/speed-car-rental-software-crs/id1372704225?ls=1&mt=8"}, {"id": "S058", "product": "car-rental-software", "kind": "user-guide", "title": "Driver Replacement on a rental agreement", "url": "https://speedautosystems.com/car-rental-software/user-guide/driver-replacement-on-a-rental-agreement/", "path": "pages/71ab4442f7800678.html", "text": "Driver Replacement On A Rental Agreement\nGo to the Rental module from the left navigation panel and open the agreements options.\nHere you can see action button with every agreement.\nclick on that action button and a drop down menu will come select the replace driver option.\nA new window will pop up you have to enter the new driver details which you are sending on replacement and press save and the new driver is assigned to that agreement."}, {"id": "S059", "product": "car-rental-software", "kind": "user-guide", "title": "Early Closing of Monthly Rental Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/early-closing-of-monthly-rental-setting/", "path": "pages/ca1132fd7948daba.html", "text": "Early Closing of Monthly Rental Setting\nThese settings are related to the monthly invoicing rule.\nYou have to enter the days from 0 to 6 and if the agreement is closed within 6 days system will charge daily rate.\nYou have to enter days from 7 to 28 and if the agreement is closed before the month than it will be charged on weekly basis."}, {"id": "S060", "product": "car-rental-software", "kind": "user-guide", "title": "Editing Company Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/editing-company-customer-account/", "path": "pages/3fdd8334085d3957.html", "text": "Editing Company Customer Account\nOpen the customer module from the left navigation panel.\nClick on the second tab for Companies.\nClick on the blue button stating “Action” with the companies.\nHere a drop down menu will pop up and select edit.\nBy clicking edit the details related to that company will appear in a new window and you can edit the company customer account from here."}, {"id": "S061", "product": "car-rental-software", "kind": "user-guide", "title": "Editing Individual Customer Account", "url": "https://speedautosystems.com/car-rental-software/user-guide/editing-individual-customer-account/", "path": "pages/01b40cbdfc34c6ab.html", "text": "Editing Individual Customer Account\nOpen the customer module from the left navigation panel.\nClick on the first tab for individual customers.\nHere you can see there is an action button with the customers click on that action button and\nyou will get option to Edit the customer.\nFrom here you can edit any kind of information of the customer you have created already."}, {"id": "S062", "product": "car-rental-software", "kind": "user-guide", "title": "Electronic Rental Agreement using Speed", "url": "https://speedautosystems.com/car-rental-software/user-guide/electronic-rental-agreement-using-speed/", "path": "pages/5c4b999f43f359f1.html", "text": "Electronic Rental Agreement using Speed – Car Rental Software Mobile App with Signature on Mobile\nTo open a agreement from the mobile you have to open the mobile application from your phone with the name of CRS.\n1. There are many options in the mobile application but you have to click on the Agreement Open the 3rd option from Mobile Application.\n2. A new window in the mobile screen will be opened and here you have to enter the details of the ahgreement according to the type of agreement and the customer details as well.\n3. When you press the next button a new window will pop up that will let you update the prices and any other details regarding to the prices.\n4. After saving all the above option application will ask you to take the signatures from the customer on the mobile application.\nNote: You can not see a agreement from mobile application for that you have to visit the web application."}, {"id": "S063", "product": "car-rental-software", "kind": "user-guide", "title": "Email Sending Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/email-sending-settings/", "path": "pages/31dce24e83d22968.html", "text": "Email Sending Settings\nEmail (SMTP)\nThe Tab “Email (SMTP)” allows you to make the settings to allow you to send various emails to your customers. By default, after having signed up on our applications, the email will be sent to your customers from speed auto systems but after having done the settings the email will be sent as per your desire from your own email id and your own name. This can be done as:-\nIn “Default from (sender) email address” enter your own email address from which you need to send the email.\nIn “Default from (sender) display name” enter your desired name to be shown on email.\nIn “SMTP host” enter your SMTP host address given by your service provider such as “smtp.gmail.com” if you are using the Gmail suite.\nIn SMTP port enter the desired number provided by your service provider such as “587” in most of the cases of Gmail suite.\nSelect “Use SSL” if the Gmail suite is being used, again this option is to be used as per requirements of your service provider.\nIn “User Name” either enter the same email address already entered in “Default from (sender) email address” above or email address on which the services have been acquired by you.\nEnter the password of the email id on which the service is activated by your service provider.\nAfter having done above all press the “Save” button below and enter some email id in “Test Email Settings” and press “SEND TEST EMAIL” button, if you receive a mail on given email id the settings have been done correctly otherwise check your settings again. If you are unable to activate your email, contact our Support Team by email, direct call or Speed Support Feature, given on our mobile apps to directly approach us."}, {"id": "S064", "product": "car-rental-software", "kind": "user-guide", "title": "Enabling Weekly & Monthly Rental", "url": "https://speedautosystems.com/car-rental-software/user-guide/enabling-weekly-monthly-rental/", "path": "pages/a4cb66115c0c5d1c.html", "text": "Enabling Weekly & Monthly Rental\nEnable Weekly Monthly :\nSelect this option If your car rental allows for Weekly and Monthly rental then select this option otherwise system will only charge on daily basis."}, {"id": "S065", "product": "car-rental-software", "kind": "user-guide", "title": "Forgot Password", "url": "https://speedautosystems.com/car-rental-software/user-guide/forgot-password/", "path": "pages/1f6a81110e410cac.html", "text": "Forgot Password\nIf you forgot your password and are unable to log in to the system then click on the Forgot Password option at the bottom of the login pop-up.\nYou have to enter you company code and email registered with the system and a password reset link will be sent to your email to reset your password. If you don’t get an email within a few minutes, please re-try. If you receive the email then follow the steps to setup new password."}, {"id": "S066", "product": "car-rental-software", "kind": "user-guide", "title": "Free Access Rental Hours Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/free-access-rental-hours-setting/", "path": "pages/dcea765f00054afd.html", "text": "Free Access Rental Hours Settings\nFree Acces Rental Hour :\nEvery Car Rental provides some leverage to their customers while checking in. Enter the grace period time in minutes, system will not charge anything extra if the vehicle is returned back wihtin the grace period after agreed time."}, {"id": "S067", "product": "car-rental-software", "kind": "user-guide", "title": "Holidays Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/holidays-setting/", "path": "pages/89dbd0c0f05e6192.html", "text": "Holidays Settings\nHoliday’s Settings:\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab.\nClick on the Holidays tab.\nClick on the blue tab on the upper right corner “Create New Holiday”\nA window will pop up. Enter the name and select the date from there and press save.\nYou can create your Public holidays from here on which the buisness remains close."}, {"id": "S068", "product": "car-rental-software", "kind": "user-guide", "title": "How to open Settings Panel", "url": "https://speedautosystems.com/car-rental-software/user-guide/how-to-open-settings-panel/", "path": "pages/6ebd33109bb57d4e.html", "text": "Watch source video online\nHow to open Settings Panel\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab."}, {"id": "S069", "product": "car-rental-software", "kind": "user-guide", "title": "HOW TO SIGN-IN", "url": "https://speedautosystems.com/car-rental-software/user-guide/how-to-sign-in/", "path": "pages/7aeb1a666d138d5e.html", "text": "How to Sign-in\nOpen URL https://app.speedautosystems.com\nPut your credentials\nCompany Code\nYour email id/ user name\nPassword\nNote: if you don’t have your user id & password, contact your system administrator"}, {"id": "S070", "product": "car-rental-software", "kind": "user-guide", "title": "Mandatory Fields Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/mandatory-fields-settings/", "path": "pages/e6f42cdd7be65e58.html", "text": "Mandatory Fields Settings\nMandatory Fields Settings:\nIndividual Customers.\nThere are some options under it and the boxes that you will check will be marked as mandatory so while creating a new customer without entering those details system will not let you move forward.\nVehicles:\nIt has 2 options and if you select those options then without entering those values while creating a new vehicle system will not let you save it. There are some additional fields available if you want to enter something extra then you can select and enter those things while creating the vehicles.\nAgreement:\nIt has two options of Advance Payment and Return Date. If you select both then without entering the advance amount and return date system will not create the agreement. It has some additional fields too that can be added and their names can be changed.\nStaff:\nIf you select the option then system will show the expiry date of staff documents in their module.\nInvoice:\nIn invoice if you want to add the commission tab then check it otherwise leave it blank."}, {"id": "S071", "product": "car-rental-software", "kind": "user-guide", "title": "Monthly Invoicing Rules Settings for Monthly Rental", "url": "https://speedautosystems.com/car-rental-software/user-guide/monthly-invoicing-rules-settings-for-monthly-rental/", "path": "pages/8a70144517d83e8e.html", "text": "Monthly Invoicing Rules Settings for Monthly Rental\nMonthly Invoicing Rules Settings for Monthly Rental:\nThis option is related to the monthly invoicing that how do you want to charge your customer if the agreement is monthly basis.\nIndividual Customers : You can select the invoicing rule according to your company that how you charge your customers. You have to select from 3 invoicing rules. Second option is about the type that do you charge the customer in advance or charge them after the services.\nCorporate Customers:\nSame options as the individual customers you have to select the invoicing rule and the type."}, {"id": "S072", "product": "car-rental-software", "kind": "user-guide", "title": "Monthly Rental Agreement Invoicing", "url": "https://speedautosystems.com/car-rental-software/user-guide/monthly-rental-agreement-invoicing/", "path": "pages/d88d849ad3fa46b8.html", "text": "Monthly Rental Agreement Invoicing\nMonthly Rental Invoicing:\nGo to the Vouchers from left navigation panel and select invoices.\nHere you will see all the invoices which are opened or closed.\nTo generate a new invoice click on the blue button on the top right corner stating Generate Invoices.\nIt will give you 3 options like\na. Rental\nb. Fines\nc. Miscellaneous\nFor rental agreement we will select the rental option and a new window popup will appear.\nIt has same process like daily and weekly and the only difference is that it will be charged after the month as you have selected the settings. First invoice will be available after 1 month and rest will be charged at the agreement closing or if its a long agreement then it will charged on monthly basis every month until the agreement is closed."}, {"id": "S073", "product": "car-rental-software", "kind": "user-guide", "title": "Opening Speed – Car Rental Software Web App", "url": "https://speedautosystems.com/car-rental-software/user-guide/opening-web-app/", "path": "pages/13354f820ff3e0f2.html", "text": "Opening Speed – Car Rental Software Web App\nOpen any browser like Chrome, Edge, Firefox, Safari on you PC, MacBook, iPad, iPhone, Android Phone, Android Tablet.\nOpen link https://app.speedautosystems.com\nIf you don’t have account then signup using the link https://app.speedautosystems.com/TenantRegistration?product=crs"}, {"id": "S074", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Advance Amount Handling", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-advance-amount-handling/", "path": "pages/b91f8aa24f5ee8bd.html", "text": "Rental Agreement Advance Amount Handling\nwhenever you are opening a new agreement the system gives you a option for advance amount. This amount is taken in advance while openeing the agreement and can be used to settle down the due amount.\nThis option is available only while opening the agreement.\nWhen you are opening the agreement fill in all the details and at the end you can see there is a box of advance and you have to enter the amount in it and press save."}, {"id": "S075", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Advance Receipt", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-advance-receipt/", "path": "pages/874917de67302abb.html", "text": "Rental Agreement Advance Receipt\nThis option is related to taking the advance amount while opening the agreement.\nWhen you are opening the agreement from the Rental module from left navigation panel you open a new agreement and fill in all details with the advance amount and when you press save the next screen is for allocating that advance amount.\nEnter the payment methods and details if any and press save the advance amount receipt will be generated.\nTo see that invoice you have to go to the vouchers from left navigation panel and open receipts.\nHere you will see the advance amount receipt generated and you can print it as well."}, {"id": "S076", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Cut-short", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-cut-short/", "path": "pages/ecfa531ef5ed11f7.html", "text": "Rental Agreement Cut-short\nGo to the Rental module from the left navigation panel and open the agreements options.\nHere you can see action button with every agreement.\nclick on that action button and a drop down menu will come select the Cut-Short option.\nThis option is for ending the agreement right away no matter when was it returning date.\nWhen you select the option same agreement will be opened and you can modify it."}, {"id": "S077", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Deposit Management", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-deposit-management/", "path": "pages/31b02f6fb5dc704a.html", "text": "Rental Agreement Deposit Management\nWhile opening an agreement right under the advance amount there is a section for Deposit as well.\nYou have to enter the deposit amount here. This amount can be used for fines or tolls or can also be adjusted for the due amount.\nWe can charge this amount throught cash or other means as well.\nFor deposits management you have to open Vouchers from the left navigation panel.\nThere you will find the option for Deposits open that and you will see all the deposits taken from the customers.\nClick on the action button with the deposit for more options related to that deposit.\nYou can use this deposit if needed. It can be refunded or extend or can also be transefred to other agreement with same customer."}, {"id": "S078", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Editing", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-editing/", "path": "pages/6023567bde3dd653.html", "text": "Rental Agreement Editing\nGo to the rental module from the left navigation panel.\nClick on the tab stating “Agreements”.\nAll the opened and closed agreement can be found here.\n1. Click on the small blue button with the settings sign on it and there will be many options.\n2. Click on the Edit option from there and you can edit the agreement.\nNote: Once a agreement is closed then there is no option for edit."}, {"id": "S079", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Extension", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-extension/", "path": "pages/dd4e3485628e8e1a.html", "text": "Rental Agreement Extension\nGo to the Rental module from the left navigation panel and open the agreements options.\nHere you can see action button with every agreement.\nclick on that action button and a drop down menu will come select the Extend option.\nThe same agreement will be opened in front of you and you can extend the agreement by changing its return date and press save."}, {"id": "S080", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Final Settlement Receipt", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-final-settlement-receipt/", "path": "pages/07bacccea6e9417d.html", "text": "Rental Agreement Final Settlement Receipt\nWhen a agreement is closed its final receipt is generated in the system automatically.\nTo see the receipt you have to go to the vouchers module from the left navigation panel.\nSelect the option for receipt and here you will see all the receipt.\nIf you want to create a new receipt then click on the blue button on top stating “Create New Receipt”\nIf you have closed the agreement then the receipt will be generated automatically.\nJust find it with the agreement number and click on the action button with that receipt.\nHere you have to select the “Allocation (Receivables)” from the drop down menu.\nHere you have to enter the amount in the Allocated Now section and when you press save it will be allocated and the invoice will be generated."}, {"id": "S081", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Log", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-log/", "path": "pages/5682a2d26a5b7494.html", "text": "Rental Agreement Log\nGo to the Rental module from the left navigation panel and open the agreements options.\nHere you can see action button with every agreement.\nclick on that action button and a drop down menu will come select the log.\nA new window will show you the activity made on that agreement and made by whom as well will be shown."}, {"id": "S082", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Opening", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-opening/", "path": "pages/0df5453a58464404.html", "text": "Watch source video online\nRental Agreement Opening\nClick the “Rental” link in the left navigation panel\nClick “Agreements”\nAgreement will be shown on right panel\nClick button “+Open Agreement” on right top corner to open a new rental agreement\nSelect the agreement type (daily, weekly, monthly) from “Type” field\nEnter data in compulsory fields. Save button will not enable till all compulsory fields are filled."}, {"id": "S083", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Agreement Printing", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-agreement-printing/", "path": "pages/76870e408fb9e11a.html", "text": "Rental Agreement Printing\nGo to the rental module from the left navigation panel.\nClick on the tab stating “Agreements”.\nAll the opened and closed agreement can be found here.\n1. Click on the small blue button with the settings sign on it and there will be many options.\n2. Click on the Print option and you can get a print of that agreement from your printer connected to the system."}, {"id": "S084", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Bookings Management", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-bookings-management/", "path": "pages/d2562e58e36f719f.html", "text": "Rental Bookings Management\nThis option is related to the bookings. If you have our booking engine or any other booking engine integrated to our application then all the bookings made through that booking engine will appear here.\nIf you want to manually add a booking then:\nOpen the rental module from the left navigation panel.\nHere you will find the second tab related to “Bookings”.\nClick on the blue button on the right top stating “Add New Booking”\nA pop up window will appear:\n1. You have to select the type of the booking.\n2. Select the Pickup & Dropoff Date and time.\n3. You have to select the dropoff location but if dont know then click on others.\n4. Then you have to select the vehicle type to get the tariff. In bookings if you want to select a vehilce than you can otherwise it can be procedded without selecting a vehivle.\n5. Select the customer on which you are making a booking.\n6. Column on right side shows you the charges type and its rates. You can add those charges here or leave it blank and press save ad the new booking is created."}, {"id": "S085", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Discounts Management", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-discounts-management/", "path": "pages/bb4379b7489cd792.html", "text": "Rental Discounts Management\nOpen the rental module from the left navigation panel.\nHere you will find the second tab related to “Discount Auth Codes”.\nFrom here you can give access for discounts for some special customers or your employee to increase the sales.\n1. Click on the blue button on top right and you will see a menu.\n2. First you have generate a new code number and it can number or alphabets or both can apply.\n3. After that you have to mention the discount in % and it wont allow to give more than 20%.\n4. Then you have to select that it is for hours or days.\n5. Then you can also select that how many times the same code can be applied.\n6. Then you have to select the employee for which you are generating this discount code.\n7. you can put in the reason if you want for providing the discounts."}, {"id": "S086", "product": "car-rental-software", "kind": "user-guide", "title": "Rental Extras Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/rental-extras-settings/", "path": "pages/d5164dd46b6c297e.html", "text": "Rental Extras Settings\nRental Extra Settings :\nEnable customer wise settings for monthly invoicing : If you select this option than there will be an option for every individual customer that at the time of creating the agreement you will have option to put the invoicing rule that you want to charge it with which rule.\nReceipt On-Screen Allocation with Receivables : If we select this option it will restrict the user to allocate the reciveable amount to related invoice.\nReceipt On-Screen Allocation with Types of Charges: If we select this option here you will have to allocate each charge type to the invoice.\nOthers:\na. If we check this box then you have to manually enter the agreement no and if you uncheck then system will automatically generate agreement no.\nb. If we check this box then you have to manually enter the booking no and if you uncheck then system will automatically generate booking no.\nc. While opening new agreement from moble app if you want to take signatures on agreement then check it otherwise the electronic signatures will be taken only on checking out and checking in.\nd. If you select this then you have to enter the purchase order details and without entering the number you will not be able to proceed. (Kindly uncheck this to run the system smoothly)\ne. While creating a workshop movement if we check this then system will not let us go further and make a movement untill we enter some details or notes about it.\nf. While replacing a vehicle the diffrence of fuel level will be invoiced if we select this otherwise it will be charged at the time of agreement closing.\ng. If we select this then whenever we are creating a invoice a sale order will also be generated.\nh. If we check this option then system will show us estimated reports based on the actual closing charges not including extra things.\ni. This option is related to fufture checkouts that the car is to be checked out after 3 days but the person will not be available on that day so he checkout the vehicle today.\nj. If we select this then we have another line to add notes to the agreement.\nk. If we select this option then it will put all the new and previous cheques directly to bank to clear the accounts.\nl. If we select this option then whenever the customer pays the bill agreement shows the same date.\nm. If we select this option then system will not allow us to rent diffrent vehicles on same driver.\nn. If we select this option then agreements opened on weekly basis will be charged weekly not on daily or monthly.\no If we select this then system will not allow us to make a agreement if the documents or driving license or passport is expired of the customer.\np If we select this option then at the time of closing the agreement we have option of providing the discount otherwise that option is only available while opening the agreement.\nq This option is related to Credit Card if we select this then without entering the last 4 digits system will not allow you to move further."}, {"id": "S087", "product": "car-rental-software", "kind": "user-guide", "title": "Signup using Speed – Car Rental Software signup through Android Mobile App", "url": "https://speedautosystems.com/car-rental-software/user-guide/signup-using-speed-car-rental-software-android-mobile-app/", "path": "pages/bc86268f5c95d07d.html", "text": "Watch source video online\nCar Rental Software signup through Android Mobile App\nDownload Speed – Car Rental Software Mobile App form Google Play Store using the link: https://play.google.com/store/apps/details?id=com.speedautosystems.crs\nAfter the installation of the mobile app, click the “Sign Up” button."}, {"id": "S088", "product": "car-rental-software", "kind": "user-guide", "title": "Signup using Speed – Car Rental Software iOS Mobile App", "url": "https://speedautosystems.com/car-rental-software/user-guide/signup-using-speed-car-rental-software-ios-mobile-app/", "path": "pages/e5572b73a1a8ec3a.html", "text": "Watch source video online\nCar Rental Software signup through iOS Mobile App\nDownload Speed – Car Rental Software Mobile App from Apple App Store using the link: https://itunes.apple.com/us/app/speed-car-rental-software-crs/id1372704225?ls=1&mt=8\nAfter the installation of the mobile app, click the “Sign Up” button."}, {"id": "S089", "product": "car-rental-software", "kind": "user-guide", "title": "Signup using Speed - Car Rental Software Web Page", "url": "https://speedautosystems.com/car-rental-software/user-guide/signup-using-speed-car-rental-software-web-page/", "path": "pages/4611cbf2b3215902.html", "text": "Watch source video online\nSignup using Speed – Car Rental Software Web Page\nOpen Speed – Car Rental Software Home Page https://www.speedautosystems.com/car-rental-software/\nOn the right side panel, you can click the link “Get Started Now Free (Sign Up)”\nYou can directly click the link https://app.speedautosystems.com/TenantRegistration?product=crs to open the Sign-Up screen."}, {"id": "S090", "product": "car-rental-software", "kind": "user-guide", "title": "Time-Zone Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/time-zone-setting/", "path": "pages/8e935cb174567b64.html", "text": "Watch source video online\nTime-Zone Settings\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab.\nClick on the Common tab, this tab will give you options to select your time zone."}, {"id": "S091", "product": "car-rental-software", "kind": "user-guide", "title": "Updating Vehicles", "url": "https://speedautosystems.com/car-rental-software/user-guide/updating-vehicles/", "path": "pages/07eea5694595084d.html", "text": "Updating Vehicles\nSelect the fleet module from the left navigation panel.\nClick on the fleet tab, and then on Vehicle.\nHere you will see the action button with every vehicle.\nWhen you click the action button a window pops up:\na. You can view the details of vehicle.\nb. you can edit or update the vehicle.\nc. You can update the millage.\nd.You can also see the agreements history made on that specific vehicle."}, {"id": "S092", "product": "car-rental-software", "kind": "user-guide", "title": "Uploading Company Documents", "url": "https://speedautosystems.com/car-rental-software/user-guide/uploading-company-documents/", "path": "pages/7a83de3f62142b9d.html", "text": "Uploading Company Documents\nOpen the customer module from the left navigation panel.\n1. Click on the second tab for Companies.\n2. Click on the blue button stating “Create New Company”\n3. A pop up will appear and go to the next tab from top stating “Documents”.\nYou can enter the company Trade License or any such document here with the details and the picture as well."}, {"id": "S093", "product": "car-rental-software", "kind": "user-guide", "title": "Uploading Individual Customer Documents", "url": "https://speedautosystems.com/car-rental-software/user-guide/uploading-individual-customer-documents/", "path": "pages/de7eb38d33654391.html", "text": "Uploading Individual Customer Documents\nOpen the customer module from the left navigation panel.\nClick on the first tab for individual customers.\nClick on the blue button stating “Create New Individual”\nA pop up will appear and go to the next tab from top stating “Documents”.\nHere you can add any type of documents for the customer. System allows you to upload a file in form of image so you can scan the document and upload it to the system."}, {"id": "S094", "product": "car-rental-software", "kind": "user-guide", "title": "VAT Setting", "url": "https://speedautosystems.com/car-rental-software/user-guide/vat-setting/", "path": "pages/a07879d6727e91b0.html", "text": "VAT Settings\nClick on the Administration Tab on the left side Navigation panel and then click on Settings Tab.\nClick on Common tab and scroll down to tax percentage.\nEnter default tax rate in the box in numbers.\nSelect in between Tax Inclusive or Tax Optional.\n*Tax Inclusive is that all your charges are after tax included in them.\n**Tax Optional your Tax is optional and is not included in the price if charged, then charged separately."}, {"id": "S095", "product": "car-rental-software", "kind": "user-guide", "title": "Vehicle Replacement on a rental agreement", "url": "https://speedautosystems.com/car-rental-software/user-guide/vehicle-replacement-on-a-rental-agreement/", "path": "pages/d607c0b6299fa8c9.html", "text": "Vehicle Replacement On A Rental Agreement\nGo to the Rental module from the left navigation panel and open the agreements options.\nHere you can see action button with every agreement.\nclick on that action button and a drop down menu will come select the replace vehicle option.\nWhen you click on it a new window will pop up.\nYou have to enter the details of the replacement vehicle and press save and by this you can simply replace the vehicle.\nNote: Replacement can only be made on open agreements."}, {"id": "S096", "product": "car-rental-software", "kind": "user-guide", "title": "Vehicles Documents Management", "url": "https://speedautosystems.com/car-rental-software/user-guide/vehicles-documents-management/", "path": "pages/89809ead04c55c7c.html", "text": "Vehicles Documents Management\nSelect the fleet module from the left navigation panel.\nClick on the fleet tab, and then on Vehicles.\nClick on “Create New Vehicle” on the upper right corner.\nA popup window will appear , you will see a “Documents” button click on that button.\nHere you can see a Blue Button on the right side. From this button you can upload the documents of specific vehicle."}, {"id": "S097", "product": "car-rental-software", "kind": "user-guide", "title": "Vehicles QR Codes Generation", "url": "https://speedautosystems.com/car-rental-software/user-guide/vehicles-qr-codes-generation/", "path": "pages/2df86341f1abece5.html", "text": "Vehicles QR Codes Generation\nSelect the fleet module from the left navigation panel.\nClick on the Vehicle QR Label Tab.\nClick on blue tab “Generate QR Labels” on the top right corner, QR labels will be generated.\nYou can generate a single QR label by only entering a plate no of vehicle.\nSystem allows you to print QR labels in 2 sizes 1 for Door label and other one for KeyChain."}, {"id": "S098", "product": "car-rental-software", "kind": "user-guide", "title": "Weekend Settings", "url": "https://speedautosystems.com/car-rental-software/user-guide/weekend-settings/", "path": "pages/56dace512a9746d1.html", "text": "Weekend Settings\nWeekend Settings:\nIf your Company give special promotions or charge extra on weekends then add your weekend days accordingly.\nIf you select the option “Mix Weekend with normal rental” then there will be no effect in the system and its charges.\nYou can also set a limit of KM for the weekend. If no limit then leave it blank."}, {"id": "S099", "product": "car-rental-software", "kind": "user-guide", "title": "Your Company Letter Head Update", "url": "https://speedautosystems.com/car-rental-software/user-guide/your-company-letter-head-update/", "path": "pages/e22cf8d98fdf340b.html", "text": "Your Company Letter Head Update\nCompany Letter head Update :\nOpen Profile tab in settings click on the choose file for Letter head and your Company letter head will be updated."}, {"id": "S100", "product": "car-rental-software", "kind": "user-guide", "title": "Your Company Logo Update", "url": "https://speedautosystems.com/car-rental-software/user-guide/your-company-logo-update/", "path": "pages/6be0c7b537fb958e.html", "text": "Your Company Logo Update\nCompany Logo Update :\nOpen Profile tab in settings click on the choose file for Logo and your Company logo will be updated."}, {"id": "S101", "product": "e-fuel-management-system", "kind": "product-reference", "title": "E-Fuel Management System", "url": "https://speedautosystems.com/e-fuel-man lt generation, it is perfect for car rental businesses.\nOur financial system would be too beneficial for you to use as you will be able to integrate it easily with any of the software provided by Speed Auto Systems.\nFor instance, if you have a Speed Car Rental Software (CRS) to manage your fleet, you will be able to incorporate Speed Financial System with CRS and get awesome results. It will provide you insights and useful trends so that you can foresee your business like never before.\nReal-Time Reports And Customized Insights\nA well-integrated system will help you in more than one way. You will be able to witness the following benefits from the integration of Speed Financial System:\nReal-time reports about your income, expenses, expenditures, and profits/loss factors.\nIt will allow you to track transactions for every single vehicle separately and effectively.\nEvery transaction will have a money trail and proper purpose integrated with the movement of vehicles.\nThere will be a vibrant and immediately available track of your expenses, income, and sundry transactions.\nYou will be able to manage Fines, Salik, Toll fees, eFines, and several other regulatory expenses even customized as per your need.\nA vigorous solution for your overall business expenditures. Keeping keen observation on all the amounts in and out.\nLast yet not least, manage your salaries, repairing costs, sale/purchase of vehicles or spare parts, and even your taxes with Speed Financial System.\nStart 30 Days Free Trial\nLet’s get you Started\nIf you want to know more about Speed Financial System (FS), let’s get connected.\nGet in Touch"}, {"id": "S106", "product": "financial-system", "kind": "product-reference", "title": "Speed Enterprise Resource Planning (ERP) Benefits", "url": "https://speedautosystems.com/financial-system/benefits/", "path": "pages/f525170ad62939cd.html", "text": "Get in Touch\nReal Time Impact of Operations on Financial Books\nSPEED FINANCIAL SYSTEM (FS)\nSpeed Financial tion that not only manages your fleet but also provides you with necessary matrices such as revenue, expenses, and profit, etc.\nKeeping this aspect in the account, Speed Auto Systems has developed Enterprise Resource Planning (ERP) solution. It would help you to finely estimate the performance of each vehicle in terms of money.\nWhy Speed Enterprise Planning (ERP) Software For Vehicle Profitability?\nWell, Speed Enterprise Planning (ERP) software is unique and one of its kind in the market. Its compatibility and value addition qualities make it stand out among its contenders. So, it’s ideal for vehicle profitability.\nIt incorporates operations with finance and makes it easier to record every transaction directly into ERP.\nAs vehicles are your primary source of revenue, Speed ERP is designed to induce data from the movements of vehicles and agreements.\nIt would make you able enough to count on every vehicle individually. So, you will be able to scrutinize vehicles as per revenue.\nSpeed ERP is easily integrated with all other solutions provided by Speed Auto Systems.\nYou will experience an all-in-one scenario. So, it would be the whole solution for your all rental business needs.\nGo For Speed ERP\nYes, it’s time to switch to smart solutions. Speed ERP is one of the best solutions in the industry. With value-added service and highly professional support, it is the most popular software among entrepreneurs.\nStart 30 Days Free Trial\nLet’s get you Started\nIf you want to know more about Speed Financial System (FS), let’s get connected.\nGet in Touch"}, {"id": "S108", "product": "financial-system", "kind": "product-reference", "title": "No Mistakes In Unified FS When Transferring Data", "url": "https://speedautosystems.com/financial-system/benefits/no-mistakes-in-unified-fs-when-transferring-data/", "path": "pages/9fa35b79e1a29ba3.html", "text": "Get in Touch\nReal Time Impact of Operations on Financial Books\nSPEED FINANCIAL SYSTEM (FS)\nSPEED FINANCIAL SYSTEM (F ul strategies will boost your business’s revenue.\nSimultaneously updated solutions will never lead you to complicated situations due to false mapping among software.\nEnhanced compatibility will ensure the uninterrupted flow of data and hence creating a loop of excellence in operations and reporting.\nIn the end, you will witness the minimum possible mistakes in information and insights. This will lead to accurate and timely decisions.\nSpeed Financial System (FS) – Eliminates Mistakes In Your Data\nHire Speed Financial System (FS) solutions and go freely and smoothly. Highly professional and immediately available support will never let you down. So, be confident in your choice and go for the world’s most demanded solution for your rental business, Speed Financial System.\nStart 30 Days Free Trial\nLet’s get you Started\nIf you want to know more about Speed Financial System (FS), let’s get connected.\nGet in Touch"}, {"id": "S109", "product": "financial-system", "kind": "product-reference", "title": "No More Delay In Data Transfer", "url": "https://speedautosystems.com/financial-system/benefits/no-more-delay-in-data-transfer/", "path": "pages/6360f1ab99e632a1.html", "text": "Get in Touch\nReal Time Impact of Operations on Financial Books\nSPEED FINANCIAL SYSTEM (FS)\nSPEED FINANCIAL SYSTEM (FS)\nNo More Delay In Data Transfer From Front Office To Back Office\nA business holds more than one desk to manage all the operations. For instance, the front office desk deals with customer engagement, vehicle booking, check-in and check-out, and customer queries. On the other hand, the back office is responsible for the operations that are not directly concerned with the customers, for instance, account keeping, vehicle management, and HR administration, etc.\nThough these desks sound separate yet they operate in an interdependent and synchronized manner. So, the front office and back office will operate as much efficient as they were connected. Certain smart solutions make it more synchronized. For instance, Speed Enterprise Planning (ERP) offers an all-in-one solution assisting in the front office and back office operations simultaneously.\nDisadvantages Of Delayed Data Synchronization\nFront office experiences bombardment of information. This information further should be transferred to the back office. Then, the back office processes data and make it meaningful as well as insightful for top-level management and decision making. However, if the data transfer is delayed, it will cause several deficiencies like;\nDelayed data transfer will lead to delayed data processing and analysis.\nIt will cause delayed decision making.\nManagement would be on-hold as long as the data is transferred to the back end office and analyzed into meaningful insights.\nThe business would face failure in updating customers about invoices and transactions timely.\nDelays in management and financial reports will prevent the business to make smart moves.\nWhy There Should Be Compatible Front Office And Back Office Solutions\nYes, one can ask it. Well, a business should carry unified and compatible smart solutions for the sake of all operational management. Here are some salient benefits of having an integrable and compatible planning solution.\nFast data transfer from the front office to the back office will allow you to make smart and quick decisions.\nA perfect mapping between the front office and back office will make your business more customer-oriented.\nYou would be able to send invoices and transaction details in real-time.\nA perfectly mapped smart system will keep updated both front offices as well as beck office in real-time.\nChoose The Speed Enterprise Resource Planning Solution\nSpeed ERP solution provides you with the best ever and integrable front office and back office operational compatibility. With Speed ERP you will witness and experience professionalism, and ultimate support, and smart working.\nSo, what are you waiting for? Just grab your he Speed-vehicle inspection app provides seamless check-ins/outs management, recording every damaged detail on every trip. The vehicle mobile inspection app enables you to manage your vehicle logs digitally over your mobile, eliminating complex paper-based car inspection. Paperless car inspection will save time and increase your staff’s productivity.\nSpeed knows the challenges faced by companies in automotive mobility. Keeping track of vehicle conditions and maintaining accurate records manually can be a hectic task. That’s why we have developed an efficient App that simplifies and digitalizes the entire inspection process.\nSilent features of VEHICLE MOBILE INSPECTION:\nSeamless check-out and check-in management.\nAccurate damage recording.\nEffective Damage History record\nDigital logs with cloud backup\nPaperless Go Green approach\nDigital Signatures Acknowledgement\nAccessible anywhere from any device.\nQR identification code.\nTo learn more about the VEHICLE MOBILE INSPECTION Please click here\nTo Download the App from the Google Play Store, Please click here\nWant to connect with our team? Please fill out the form below."}, {"id": "S125", "product": "payments-automation-for-auto-industry-streamline-with-advance-solution", "kind": "product-reference", "title": "Payments Automation for Auto Industry Streamline with advance solution", "url": "https://speedautosystems.com/payments-automation-for-auto-industry-streamline-with-advance-solution/", "path": "pages/369201a7c98418c1.html", "text": "Get in Touch\nMake Yourself Comfortable with our E-payment System\nE-Payment System\nSpeed Auto Systems is proud to introduce our cutting-edge E-payment System, specifically designed for the automotive industry to automate Payment Collection Processes from Customers. We understand the challenges posed by manual payment collection ways and our goal is to provide you with a seamless and efficient solution.\nSay goodbye to the manual task of requesting payments from customers. With our automatic e-payment system, invoices are sent directly to your customers’ email addresses. They can conveniently settle their payments by clicking the payment link provided on the invoice using the credentials Credit Card. Our electronic form eliminates the need for printed invoices, saving costs and reducing environmental impact. Also, reduces the need for manual follow-ups and ensures a hassle-free payment experience for your customers.\nSilent Payments and Direct Debits are two distinct features of our E-Payments Automation System.\nOur system activates silent payments, automatically processing payments in the background whenever they are due from the client’s side. With silent payments, you can automate the payment collection process effortlessly. When a payment is due from a customer, our system quietly identifies it and charges the customer’s credit card. This streamlines the payment process, saving your time and effort.This means you no longer have to manually track and request payments.\nDirect Debits\nDirect Debits facility offers a convenient way to collect car lease installments directly from your customers’ bank accounts. This feature provides flexibility and ease of payment for both, you and your customers. Automatically on the basis of a Pre Agreement Between the Account Holder, Bank, and Customer. The agreed-upon amount will be deducted automatically, ensuring a smooth and reliable payment process. Hence, Car Lease installment can be deducted easily from the bank.\nOur E-payment System seamlessly integrates Car Rental Software with a variety of Point of Sale (POS) systems, ensuring a smooth and streamlined payment process.\nWe cater to the Auto industry across the Globe, providing flexible solutions that comply with country-specific requirements and regulations. Full features of our product are available across Europe, the UK, Canada, and the USA, While specific features are available in the UAE with the option of Customization.\nE-payment System, specifically provides seamless integration with popular payment gateways like CCAvenue, Network International, Stripe, and Checkout. This ensures secure and reliable payment processing.\nCustom Process Development\nWe understand that every Automobile Business is unique, and our goal is to provide solutions tailored to your specific needs. Whether you’re transitioning to e-payments, seeking to enable direct debits from leasing companies, or aiming to develop a customer-centric payment process, our team of experts is ready to assist you. We have the knowledge and resources to customize our e-payment system to suit your requirements, ensuring a seamless and efficient payment experience for both you and your customers.\nJoin the growing number of automotive businesses in the UAE that have embraced our innovative e-payment solution. Experience the convenience, efficiency, and customer satisfaction that come with seamless electronic transactions. Contact us today and embark on this transformative journey.\nTo learn more about our innovative e-payment solutions, please get in touch with us using our contact form. Our team of experts is ready to assist you in customizing the process to suit your unique needs. Whether you’re transitioning to e-payments, enabling direct debit from leasing companies, or developing a customer-centric payment process, we have the knowledge and resources to support you."}, {"id": "S126", "product": "speed-auto-systems-integration-with-zatca-e-invoicing-for-all-rental-leasing-companies-in-ksa", "kind": "product-reference", "title": "Speed Auto Systems Integration with ZATCA E-invoicing for all Rental & Leasing companies in KSA", "url": "https://speedautosystems.com/speed-auto-systems-integration-with-zatca-e-invoicing-for-all-rental-leasing-companies-in-ksa/", "path": "pages/ae9fc248ece107e1.html", "text": "Speed Auto Systems Integration with ZATCA E-invoicing for all Rental & Leasing companies in KSA\nSpeed Auto Systems is pleased to announc
