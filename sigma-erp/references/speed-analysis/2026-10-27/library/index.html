, "title": "How to define Receipt Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-receipt-number/", "path": "pages/795c60b407a0d425.html", "text": "How to define Receipt Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Receipt Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S228", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Return Cheque Receivable Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-return-cheque-receivable-number/", "path": "pages/09c22fb6bc03c1a9.html", "text": "How to define Return Cheque Receivable Number\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Return Cheque Receivable Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S229", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Services", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-services/", "path": "pages/0b11fdd81cd5c14d.html", "text": "How to define Services\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Service Items module.\nNow, choose among three options; default, make wise, or model wise.\nClick on the +CREATE NEW SERVICE button. You can also import data by clicking on the IMPORT button on top-right side of the window.\nClick HERE if you have a query or an issue."}, {"id": "S230", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define Suppliers Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-suppliers-code/", "path": "pages/92b29012b8c9237e.html", "text": "How to define Suppliers Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Suppliers Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S231", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define the Credit Note Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-the-credit-note-number/", "path": "pages/ba8ad2233ef44e33.html", "text": "How to define the Credit Note Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust the Credit Note Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S232", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define the Payment Number", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-the-payment-number/", "path": "pages/68249b583b47e3ed.html", "text": "How to define the Payment Number?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Payment Number.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S233", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to define the Staff Code", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-define-the-staff-code/", "path": "pages/0af1ab03425ce255.html", "text": "How to define the Staff Code\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Document No’s tab.\nScroll down, locate, and adjust Staff Code.\nScroll down and click on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S234", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Download/Process Fines", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-download-process-fines/", "path": "pages/79ed427b83e3dc5a.html", "text": "How to Download/Process Fines\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Download/Process Fines module.\nSelect a date range and click on the PROCESS button. No of processed fines in total and with agreements will appear.\nYou can download this data by clicking on the DOWNLOAD button integrated on the top-right side of the window.\nClick HERE if you have a query or an issue.\nClick here to add your own text"}, {"id": "S235", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Download/Process Tolls", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-download-process-tolls/", "path": "pages/7532e213e88ad0d0.html", "text": "How to Download/Process Tolls\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Download/Process Tolls module.\nSelect a date range and click on the PROCESS button. No of processed tolls in total and with agreements will appear.\nYou can download this data by clicking on the DOWNLOAD button integrated on the top-right side of the window. Select one option between “Download Pending Tolls For All Accounts” and “Download Tolls for service Tags” before clicking on the DOWLOAD button.\nClick HERE if you have a query or an issue."}, {"id": "S236", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to download Speed – VLS Android App", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-download-speed-vls-android-app/", "path": "pages/59f1c149f56dc7c4.html", "text": "How to download Speed – VLS Android App?\nGo to the Play Store of your Android phone and search for Speed – Car Rental Software (CRS) or click on the link below:\nhttps://play.google.com/store/apps?hl=en\nSelect the Speed – Car Rental Software (CRS) App and download it.\nClick HERE if you have a query or an issue."}, {"id": "S237", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to download Speed – VLS iOS Mobile App", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-download-speed-vls-ios-mobile-app/", "path": "pages/653f1569615e2cae.html", "text": "How to download Speed – VLS iOS Mobile App?\nGo to the App Store of your iPhone and search for Speed – Car Rental Software (CRS) or click on the link below:\nhttps://www.apple.com/ios/app-store/\nSelect the Speed – Car Rental Software (CRS) App and download it.\nClick HERE if you have a query or an issue."}, {"id": "S238", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Edit/Delete an office branch in Speed – VLS", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-edit-delete-an-office-branch-in-speed-vls/", "path": "pages/5b97111f2e3fab59.html", "text": "How to Edit/Delete an office branch in Speed – VLS?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Branches module.\nA dashboard will appear on the right side of the panel. Now, go for the ACTIONS button (integrated with each branch name), and click on it.\nA list with two options Edit/Delete will appear. Click on either option to perform an action.\nClick HERE if you have a query or an issue."}, {"id": "S239", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage a profile", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-a-profile/", "path": "pages/94eeb37c392dc35c.html", "text": "How to manage a profile?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo to the Profile tab.\nChoose the file for Letter Head and Logo.\nClick HERE if you have a query or an issue."}, {"id": "S240", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Audit Trails", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-audit-trails/", "path": "pages/d11ca97e9bf53981.html", "text": "How to manage Audit Trails?\nGo to the panel on left side, scroll down to Administration module and click on it.\nScroll down and click on Audit Trails module.\nFill in the form with date range, record number, record type, and user, etc.\nClick on the SEARCH button.\nAll the Audit Trail details will be opened. You can export this data to excel as well.\nClick HERE if you have a query or an issue."}, {"id": "S241", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Cost Centers", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-cost-centers/", "path": "pages/f4943a1d31384d3c.html", "text": "How to manage Cost Centers?\nCost Centers module allows you to categorize your costs into smaller heads like retail cost or management cost, etc.\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on Cost Centers module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW COST CENTER” button.\nFill the form and click on the SAVE button.\nIf you want to Edit/Delete any cost, click on the Actions button and choose action accordingly.\nClick HERE if you have a query or an issue."}, {"id": "S242", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Cost Settings", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-cost-settings/", "path": "pages/7aed58652854e623.html", "text": "How to manage Cost Settings\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Cost Settings module.\nClick on the +CREATE NEW RECORD button.\nA form will appear. Here put the make & model and mark-up percentage.\nNow, define each cost particular individually. Adjust rate type or rate and period carefully.\nIn the end, click on the SAVE button. Cost parameters has been set for a particular make & model.\nYou can view, edit, or delete each lease record by clicking on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S243", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage currency parameters", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-currency-parameters/", "path": "pages/ba522f81fc413053.html", "text": "How to manage currency parameters?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nHere you will see slots for Currency Code, Currency Name, and Decimal Currency Name. Adjust them accordingly.\nScroll down and click on the SAVE button at the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S244", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Divisions module", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-divisions-module/", "path": "pages/463ed6dbfb72ad78.html", "text": "How to manage Divisions module?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Divisions module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW DIVISION” button.\nFill the form and click on the SAVE button.\nIf you want to Edit/Delete any DIVISON, click on the ACTIONS button and choose action accordingly.\nClick HERE if you have a query or an issue."}, {"id": "S245", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Error Logs", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-error-logs/", "path": "pages/fcee6d96760af385.html", "text": "How to manage Error Logs?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Error Logs module.\nSelect a date range and click on the REFRESH button.\nAll error logs will appear on the screen as a list. You can export this data to excel.\nClick HERE if you have a query or an issue."}, {"id": "S246", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage holidays", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-holidays/", "path": "pages/6decc7298e1423d4.html", "text": "How to manage holidays\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Holidays tab.\nClick on the +CREATE NEW HOLIDAY button. And fill the details. Then, click on SAVE button.\nTo view, edit, or delete a Holiday click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S247", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage individual customers", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-individual-customers/", "path": "pages/e32971af811d9473.html", "text": "How to manage individual customers\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Individuals module. A window will open.\nClick on the +CREATE NEW INDIVIDUAL button.\nA form will appear. Fill the details, add documents, and billing information. Then, click on the SAVE button.\nIndividual customer will appear in a listed format.\nTo view, edit, or delete, click on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S248", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Lease Inquiries", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-lease-inquiries/", "path": "pages/a95bc100c0f63163.html", "text": "How to manage Lease Inquiries\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Inquiries module.\nClick on the +CREATE NEW LEASE INQUIRY button.\nA form will appear. Here put the date, sales person name, customer name, contact person (if customer is a company), and then enter the vehicle details. If you want to add more than one vehicle for a single customer, click om the Add Row option below every vehicle detail.\nNow, click on the SAVE button.\nAll inquiries will appear as a list in the window.\nYou can view, edit, or delete by clicking on the ACTIONS button.\nIf you have to search a specific inquiry, put lease inquiry number or customer name and date. Then, click on the REFRESH button.\nClick HERE if you have a query or an issue."}, {"id": "S249", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Message Logs", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-message-logs/", "path": "pages/9c97a1f21ea790e7.html", "text": "How to manage Message Logs?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Message Logs module.\nSelect a date range and click on the SEARCH button.\nYou can export or print this data as well.\nClick HERE if you have a query or an issue"}, {"id": "S250", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Monthly Rental Calculations", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-monthly-rental-calculations/", "path": "pages/02381086d2dbd006.html", "text": "How to manage Monthly Rental Calculations?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nScroll a little down and you will see the heading of Monthly Rental Calculation. Adjust figures as per your business and fleet requirements.\nScroll down and click on the SAVE button at the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S251", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage notifications", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-notifications/", "path": "pages/a17f6f2739ee93e0.html", "text": "How to manage notifications\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Notifications tab.\nCheck or unchecked boxes according to your business and agreement needs.\nClick HERE if you have a query or an issue."}, {"id": "S252", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage replacement reasons", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-replacement-reasons/", "path": "pages/962e27aff3602963.html", "text": "How to manage replacement reasons?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Replacement Reasons module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW REASON” button.\nClick on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S253", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Service Log", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-service-log/", "path": "pages/8748ba0b2c2dbfda.html", "text": "How to manage Service Log\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Service Log module.\nNow, put all or few parameters like plate number, date range, workshop, or service item. Then, click on the REFRESH button.\nA complete list of the service log will be displayed in the window. You can print or export this data by clicking on the REPORT button.\nClick HERE if you have a query or an issue."}, {"id": "S254", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Users", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-users/", "path": "pages/c5ff549c0f19ac54.html", "text": "How to manage Users?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Users module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW USER” button.\nClick on the SAVE button.\nClick on the ACTIONS button if you want to edit a User.\nClick HERE if you have a query or an issue."}, {"id": "S255", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to manage Vehicle QR Labels", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-manage-vehicle-qr-labels/", "path": "pages/22b604469da35f89.html", "text": "How to manage Vehicle QR Labels\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Vehicle QR Labels module.\nA window will open. Now, select plate number and branch name (if any).\nChoose the type of QR label either Door Label or Keychain Label. Then, click on the GENERATE QR LABELS button.\nNow, click on the PRINT QR LABELS button and get QR labels printed.\nClick HERE if you have a query or an issue."}, {"id": "S256", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to merge contacts", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-merge-contacts/", "path": "pages/f5754675fd14b474.html", "text": "How to merge contacts?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Merge Contacts module.\nA dashboard will appear on the right side of the panel. Click on the “+SEARCH & ADD” button.\nFill the form and click on the OK button.\nNow, select the required contacts and click on the MERGE CONTACTS button.\nClick HERE if you have a query or an issue."}, {"id": "S257", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Repair Vehicle Damages in Speed – VLS", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-repair-vehicle-damages-in-speed-vls/", "path": "pages/c01bb263e298239f.html", "text": "How to Repair Vehicle Damages in Speed – VLS\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Repair Vehicle Damage module.\nPut the Plate No. in the search bar and click on the SEARCH button.\nDiagram of that vehicle will appear with damages marked on it.\nRemove the marks that you have got repaired.\nClick HERE if you have a query or an issue."}, {"id": "S258", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to select Languages", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-select-languages/", "path": "pages/fbdb360cfa150f75.html", "text": "How to select Languages?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Languages module.\nA dashboard will appear on the right side of the panel with several languages enlisted.\nClick on the ACTIONS button.\nClick on the Set as a default language option.\nClick HERE if you have a query or an issue."}, {"id": "S259", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to set Cost Parameters", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-set-cost-parameters/", "path": "pages/8e609c31e6a648ee.html", "text": "How to set Cost Parameters\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Cost Parameters module.\nA window will be opened. Go to the top-right side and click on the +CREATE NEW PARAMETERS button.\nA small window will pop-up. Choose the cost parameter name and order. Then click on the SAVE button.\nThat parameter will be enlisted in the window. You can view, edit, and remove by clicking on the ACTIONS button.\nClick HERE if you have a query or an issue."}, {"id": "S260", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Sign-In for Speed – VLS Mobile App", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-sign-in-for-speed-vls-mobile-app/", "path": "pages/58580968d484ead7.html", "text": "How to Sign-In for Speed – VLS Mobile App?\nOpen Speed – Car Rental Software (CRS) App in your smart-phone.\nPut your Company Code, Email or Username, and Password. Then, tap on the Log-In button.\nClick HERE if you have a query or an issue."}, {"id": "S261", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Sign-In for Speed – VLS Web App?", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-sign-in-for-speed-vls-web-app/", "path": "pages/7785c087abc645de.html", "text": "How to Sign-In for Speed – VLS Web App?\nOpen Speed Web App in any web-browser like Google Chrome, Firefox, or Microsoft Edge.\nClick on the link below:\nhttps://app.speedautosystems.com/Account/Login\nPut your Company Code, Email or Username, and Password. Then, click on the Log-In button.\nClick HERE if you have a query or an issue."}, {"id": "S262", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to Sign-Up for Speed – VLS Web App", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-sign-up-for-speed-vls-web-app/", "path": "pages/2f8f37917cf66abe.html", "text": "How to Sign-Up for Speed – VLS Web App?\nOpen Speed Web App in any web-browser like Google Chrome, Firefox, or Microsoft Edge.\nClick on the link below:\nhttps://app.speedautosystems.com/TenantRegistration\nFill the Sign-Up form. Check the box given below the form, and click on the Submit button.\nClick HERE if you have a query or an issue."}, {"id": "S263", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to use Payable Age Analysis", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-use-payable-age-analysis/", "path": "pages/a80db0270827bd50.html", "text": "How to use Payable Age Analysis\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Payable Age Analysis module. A window will open.\nSelect a date range. Choose options of customer, customer group, customer type, or sales person, etc. then, click on the SEARCH button.\nAll the concerning data will be displayed.\nTo print click on the PRINT button. And to export the data click on the EXPORT button.\nClick HERE if you have a query or an issue"}, {"id": "S264", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to use Statement of Accounts", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-use-statement-of-accounts/", "path": "pages/eb94e1b6ae12bab4.html", "text": "How to use Statement of Accounts\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Statement of Accounts module. A window will open.\nSelect a date range, choose option of either ledger support or outstanding, and click on the REFRESH button.\nAll details including voucher numbers, debit, credit, and running balance will be opened. You can export or print this detail as well.\nClick HERE if you have a query or an issue."}, {"id": "S265", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to use the Statement of Accounts", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-use-the-statement-of-accounts/", "path": "pages/631a197418443e0f.html", "text": "How to use the Statement of Accounts\nGo to the panel on the left side and click on the Suppliers tab.\nScroll down and click on the Statement of Accounts module. A window will open.\nSelect a date range, choose option of either ledger support or outstanding, and click on the REFRESH button.\nAll details including voucher numbers, debit, credit, and running balance will be opened. You can export or print this detail as well.\nClick HERE if you have a query or an issue."}, {"id": "S266", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "How to View/Edit/Delete a Contact Group", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/how-to-view-edit-delete-a-contact-group/", "path": "pages/74d826000c72524e.html", "text": "How to View/Edit/Delete a Contact Group?\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Contact Groups module.\nA dashboard will appear on the right side of the panel. Go to the “ACTIONS” button and click on it.\nA drop-down list with View, Edit and Delete options will appear. Choose action accordingly.\nClick HERE if you have a query or an issue."}, {"id": "S267", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Individuals", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/individuals/", "path": "pages/dc7c6ce5f1c4f5b3.html", "text": "Individuals\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Individuals module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nIndividuals Data will be imported automatically.\nYou can also download sample Individuals Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S268", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Lease Agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/lease-agreements/", "path": "pages/a2b87eaf663f6fe1.html", "text": "Lease Agreements\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Lease Agreements module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nRental Agreements Data will be imported automatically.\nYou can also download sample Rental Agreements Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S269", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Manage Master Agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/manage-master-agreements/", "path": "pages/41eb2f187c26cb7b.html", "text": "Manage Master Agreements\nGo to the panel on the left side and click on the Lease tab.\nScroll down and click on the Master Agreements module.\nHere you can see all agreements. For searching a particular agreement, put the details like master agreement number, status, customer, date range, and/or quotation reference number, and then click on REFRESH button.\nAll Agreements will appear as a list in the window.\nYou can view details or take print by clicking on the ACTIONS button.\nYou can also export the data to excel by clicking on the EXPORT TO EXCEL button.\nClick HERE if you have a query or an issue."}, {"id": "S270", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Manage Repaired Damages History", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/manage-repaired-damages-history/", "path": "pages/57f26a652f810bdf.html", "text": "Manage Repaired Damages History\nGo to the panel on the left side and click on the Fleet tab.\nScroll down and click on the Repaired Damages History module.\nSelect a date range and plate number. Then, click on the SEARCH button.\nDiagram of that vehicle will appear with previous history of damage repair.\nClick HERE if you have a query or an issue."}, {"id": "S271", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Manage sundry settings", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/manage-sundry-settings/", "path": "pages/0d76f15912c7317f.html", "text": "Manage sundry settings\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo the Common tab.\nScroll down and you will see a list of other settings. Adjust them accordingly.\nScroll down and click on the SAVE button at the end of the dashboard.\nClick HERE if you have a query or an issue."}, {"id": "S272", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Manage Vehicle Not Ready reasons", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/manage-vehicle-not-ready-reasons/", "path": "pages/53702d9ac65c5455.html", "text": "Manage Vehicle Not Ready reasons\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Vehicle Not Ready Reasons module.\nA dashboard will appear on the right side of the panel. Click on the “+CREATE NEW REASON” button.\nClick on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S273", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Managing Balance Summary", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/managing-balance-summary/", "path": "pages/01a03ed044905789.html", "text": "Managing Balance Summary\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Balance Summary module. A window will open.\nSelect a date range. Choose option of either all, with debit balance, or with credit balance. Then, click on the REFRESH button.\nThe customers’ list will be opened.\nTo print click on the PRINT button. And to export the data click on the EXPORT button.\nClick HERE if you have a query or an issue."}, {"id": "S274", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Rental Agreements", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/rental-agreements/", "path": "pages/9716463f21d9ccbe.html", "text": "Rental Agreements\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Rental Agreements module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nRental Agreements Data will be imported automatically.\nYou can also download Sample Rental Agreements Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S275", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Staff", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/staff/", "path": "pages/6b5c115cbf0e1788.html", "text": "Staff\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Staff module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nStaff Data will be imported automatically.\nYou can also download sample Staff Data by clicking on the DOWNLOAD SAMPLE FILE button. Click HERE if you have a query or an issue."}, {"id": "S276", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Statement of Accounts management", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/statement-of-accounts-management/", "path": "pages/d325c686cb087ba1.html", "text": "Statement of Accounts management\nGo to the panel on the left side and click on the Staff tab.\nScroll down and click on the Statement of Account module.\nSelect a date range and other parameters. Then, click on the REFRESH button.\nAll the details will be displayed. Now, you can either take print or export to excel.\nClick HERE if you have a query or an issue."}, {"id": "S277", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Managing Balance Summary", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/suppliers-balances-summary/", "path": "pages/66be3c365cebe4e9.html", "text": "Managing Supplier Balance Summary\nGo to the panel on the left side and click on the Suppliers tab.\nScroll down and click on the Balance Summary module. A window will open.\nSelect a date range. Choose option of either all, with debit balance, or with credit balance. Then, click on the REFRESH button.\nThe customers’ list will be opened.\nTo print click on the PRINT button. And to export the data click on the EXPORT button.\nClick HERE if you have a query or an issue."}, {"id": "S278", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Suppliers", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/suppliers/", "path": "pages/8a528863fd2b1c09.html", "text": "Suppliers\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Suppliers module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nSuppliers Data will be imported automatically.\nYou can also download sample Suppliers Data by clicking on the DOWNLOAD SAMPLE FILE button. Click HERE if you have a query or an issue."}, {"id": "S279", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Use of Balance Summary", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/use-of-balance-summary/", "path": "pages/beb7ca4ea5ca97c2.html", "text": "Use of Balance Summary\nGo to the panel on the left side and click on the Staff tab.\nScroll down and click on the Balance Summary module. A window will open.\nSelect a date range. Choose option of either all, with debit balance, or with credit balance. Then, click on the REFRESH button.\nThe Staff’s list will be opened.\nTo report click on the REPORT button. And to export the data to excel click on the EXPORT TO EXCEL button.\nClick HERE if you have a query or an issue."}, {"id": "S280", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "User Management", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/user-management/", "path": "pages/67455759eb6dc9b5.html", "text": "User Management\nGo to the panel on the left side, scroll down to the Administration module and click on it.\nScroll down and click on the Settings module.\nGo to the User management tab.\nCheck or uncheck the boxes as per your business and agreement needs.\nClick on the SAVE button.\nClick HERE if you have a query or an issue."}, {"id": "S281", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Using Receivable Age Analysis", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/using-receivable-age-analysis/", "path": "pages/d910520d616b9c5f.html", "text": "Using Receivable Age Analysis\nGo to the panel on the left side and click on the Customers tab.\nScroll down and click on the Receivable Age Analysis module. A window will open.\nSelect a date range. Choose options of customer, customer group, customer type, or sales person, etc. then, click on the SEARCH button.\nAll the concerning data will be displayed.\nTo print click on the PRINT button. And to export the data click on the EXPORT button.\nClick HERE if you have a query or an issue."}, {"id": "S282", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "Vehicles", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/vehicles/", "path": "pages/eff9bed855910fc8.html", "text": "Vehicles\nGo to the Administration module and click on it.\nClick on Data Import, a drop-down list will appear.\nClick on the Vehicles module, a dashboard will open on the right side of the menu panel.\nChoose an Excel file and click on IMPORT FROM EXCEL button.\nVehicle data will be imported automatically.\nYou can also download a sample Vehicle Data by clicking on the DOWNLOAD SAMPLE FILE button.\nClick HERE if you have a query or an issue."}, {"id": "S283", "product": "vehicle-leasing-software", "kind": "user-guide", "title": "What are custom lookups", "url": "https://speedautosystems.com/vehicle-leasing-software/user-guide/what-are-custom-lookups/", "path": "pages/8bbb39da7aaabef2.html", "text": "What are custom lookups"}, {"id": "S284", "product": "vehicle-leasing-software", "kind": "product-reference", "title": "Vehicle Leasing Software (VLS) Benefits", "url": "https://speedautosystems.com/vehicle-leasing-software/vls-benefits/", "path": "pages/041e6a757fc6e1ad.html", "text": "Get Started Now\nComprehensive Vehicle Leasing ERP\nSpeed Vehicle Leasing Software (VLS)\nSPEED VEHICLE LEASING SOFTWARE (VLS) BENEFITS\nIncrease your Leasing Business Profitability with Field Processes Automation\nRead more..\nNo More Traffic Fines Leakage with Traffic Fines Process Automation\nRead more..\nReduce Your Leasing Operation Cost with Paperless Leasing Operation\nRead more..\nDecrease Your Workload with Road Toll Process Automation\nRead more..\nIncrease Your Insurance Access Revenue & Decrease Your Vehicle Repair Cost\nRead more..\nEliminate Redundant Work with Speed – VLS API\nRead more…\nIncrease Your Productivity by Accessing Leasing System from Your Mobile\nRead more..\nDecrease Your IT Cost.\nRead more.."}, {"id": "S285", "product": "vehicle-mobile-inspection", "kind": "product-reference", "title": "Vehicle Mobile Inspection (VMI)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/", "path": "pages/f14f1af1afc0c93d.html", "text": "Get Free Tial\nVehicle Mobile Inspection (VMI)\nHome\n»\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\nVehicle Mobile Inspection Versions\nOverviewVehicle Mobile Inspection – Fleet Management Vehicle Mobile Inspection – Car Rentals Vehicle Mobile Inspection – Vehicle Leasing Operators Vehicle Mobile Inspection – Limo Operators Vehicle Mobile Inspection – Taxi Operators Vehicle Mobile Inspection – Car Dealers Vehicle Mobile Inspection – Auto Workshops Vehicle Mobile Inspection – Accident Claim Management Vehicle Mobile Inspection – Delivery Services\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\nVehicle mobile inspection (VMI) is ideal for Car rental, Leasing operators, Car dealers, Taxi & Ride sharing operators, Auto workshops, and Accident claim management companies. The Speed-vehicle inspection app provides seamless check-ins/outs management, recording every damaged detail accurately. The vehicle mobile inspection app enables you to manage your vehicle logs and damages digitally over your mobile, eliminating complex paper-based vehicle inspection. Paperless vehicle inspection can save your time, speed up your customer serving process, and increase your staff’s productivity.\nThe mobile vehicle inspection app revolutionizes the way inspections are conducted. With its user-friendly interface and intuitive features, it empowers users to efficiently assess the condition of vehicles on the go. Our mobile vehicle inspection app is best suited for you. If\nFeatures\nCheck-Out Process\nCheck-In Process\nLet’s get you Started\nIf you want to know more about Vehicle Mobile Inspection (VMI), let’s get connected.\nGet in Touch"}, {"id": "S286", "product": "vehicle-mobile-inspection", "kind": "product-reference", "title": "Vehicle Mobile Inspection for Accident Claim Management Scroll to top", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-accident-claim-management/", "path": "pages/ec06715f1662726e.html", "text": "Home\n»\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\n»\nVehicle Mobile Inspection for Accident Claim Management\nVehicle Mobile Inspection for Accident Claim Management\nVehicle Mobile Inspection for Accident Claim Management\nVehicle Mobile Inspection for Accident Claim Management is a comprehensive software for Accident Claim Management Companies covering all the aspects of workshop and vehicle replacement rental invoicing. Accident Claim management companies can integrate payment procedures for different vendors to get one consolidated report in one software using Speed vehicle mobile inspection and ERP.\nSpeed and accuracy are necessary to navigate the difficulties of accident claim administration. Incorporating mobile vehicle inspections is an important partner in this effort to increase efficiency. This technology alters the process, adding accuracy and transparency to each evaluation rather than merely speeding up claims.\nThe Benefits of Mobile Inspections in Accident Claim Management\nSpeeding Up Claims Processing\nMobile inspections drastically reduce assessment times, assuring quick claims clearance.\nFaster payouts provide claimants assurance and prompt assistance.\nEnhancing Accuracy and Recordkeeping\nFewer hiccups result in a smoother procedure where every piece of information has its proper place.\nDetailed, objective reports on the condition of a vehicle leave no space for doubt.\nEncouraging Accountability and Preventing Fraud\nMobile inspections serve as a sentinel against Fraud, preventing misconduct and spotting it when it happens. Through careful recordkeeping, they create trust and honesty with a sense of Accountability.\nImplementing Mobile Inspection Solutions in Claim Management\nHow to Choose a Good Tech Partner\nThe importance of selecting an inspection platform designed for claims.\nThe platform should interact smoothly with current systems, integrating new technologies with tried-and-true workflows.\nThis guarantees a smooth transition in which advancement is welcomed rather than imposed.\nInstruction and direction for claims adjusters\nIt is crucial to provide claims adjusters with the knowledge of mobile inspections.\nAdjusters become skilled conductors of assessments via full training and immersion in the technology, arranging a more effective claims symphony.\nEnsuring Compliance and Quality Assurance\nCompliance Is the Foundation of Claims Integrity\nFollowing industry and regulatory standards is not a choice; it is the foundation of trust.\nCompliance guarantees that claims are processed properly and ethically, reducing risks and maintaining integrity.\nQuality Assurance\nClaims excellence is defined by upholding the highest standards.\nStandardized inspection methods and stringent audits ensure that every claim meets the highest standards of correctness and dependability.\nOvercoming Obstacles in Claims Inspection Implementation\nWhile the road to advancement is promising, obstacles may occur. Adjusters’ initial reluctance and harmonizing consumer expectations are frequent roadblocks. However, with thorough training and clear communication, these obstacles may be overcome, and the promise of a more efficient, transparent process is realized.\nConclusion\nMobile vehicle inspections represent a watershed moment in accident claim administration. It’s not just about improving operations; it’s about laying the groundwork for trust and openness. By embracing this technology, insurance firms and claims adjusters are laying the groundwork for a new era in claims processing, one distinguished by precision, efficiency, and constant support. Accept the future and embrace mobile vehicle inspections."}, {"id": "S287", "product": "vehicle-mobile-inspection", "kind": "product-reference", "title": "Vehicle Mobile Inspection for Auto Workshops", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-auto-workshops/", "path": "pages/939c5bd619e5180a.html", "text": "Home\n»\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\n»\nVehicle Mobile Inspection for Auto Workshops\nVehicle Mobile Inspection for Auto Workshops\nThe Benefits of Mobile Inspections for Auto Workshops\nStreamlining Service Processes\nTime is a valuable resource in the quick-paced vehicle repair industry. Mobile inspections offer a solution since they speed up client turnaround times by cutting down on evaluation time. Along with increasing customer happiness, this efficiency enables workshops to service more vehicles in a given amount of time.\nBuilding Customer Trust and Satisfaction\nTo develop trust with clients, service recommendations must be transparent. Customers are empowered by precise reports on the state of their vehicles provided through mobile inspections, giving them the knowledge they need to make wise decisions. This degree of openness fosters trust and better levels of client pleasure.\nIncreasing Resource Efficiency\nMobile inspections aim to maximize the use of existing resources and save time. Workshops can reduce the amount of manual labour required for evaluations by automating the inspection process. As a result, they may commit resources to value-added services, which ultimately help the workshop and the client.\nVehicle Mobile Inspection for Auto Workshops\nCustomized Vehicle Mobile Inspection for Auto Workshops fosters vehicle damage details, recording precisely in a moment, saving your customer wait time. Avoid customer disputes, as damage inspections are duly acknowledged by the customer through electronic signature while checking in and out.\nA change is now taking place in the automotive services sector. Auto workshops have a fantastic potential to transform their business practices because of technological improvements. Mobile vehicle inspections, a game-changer that promises to improve consumer trust and expedite operations, are central to this revolution.\nImplementing Mobile Inspection Solutions for Auto Workshops\nHow to Choose the Best Technology Partner\nA crucial choice is which inspection platform to choose. Workshops should guarantee feature compatibility with current systems and comprehensively evaluate features. Scalability is also essential since it ensures that the technology will be able to evolve to meet the demands of the workshop.\nEmployee Onboarding and Training\nGiving specialists the knowledge and abilities needed for mobile examinations is crucial. Comprehensive training promotes a culture of technology acceptance inside the workshop while ensuring that technicians are competent in using the technology. This culture transformation is essential to reap the rewards of mobile inspections fully.\nWorkflow Integration for Mobile Inspections\nMobile inspections must smoothly integrate into the service request process to be effective. Specific procedures for post-inspection activities and fixes must be established to do this. Mobile inspections may be successfully included in the workflow of the workplace.\nEnsuring Compliance and Quality Assurance\nRegulation Compliance\nIt is important to maintain compliance with statutory obligations as well as industry standards. Strong processes must be in place for workshops to reduce any possible dangers brought on by non-compliance. It guarantees that each inspection satisfies the essential regulatory requirements.\nImplementing Strict Quality Control Measures\nHigh standards must always be upheld for a workshop to be effective. This entails developing standardized inspection processes and conducting frequent audits to ensure these requirements are constantly maintained. These steps protect the workshop’s reputation and guarantee client trust and satisfaction.\nGetting Past Obstacles in the Implementation of Mobile Inspections\nMobile inspections provide many advantages, but there may also be drawbacks. Initial reluctance from employees and consumers and possible barriers to technology adoption are common barriers. However, successful methods for overcoming these challenges include proactive communication, thorough training, and feedback loops.\nConclusion\nA turning point in the automotive service sector has been reached by integrating mobile vehicle inspections. Along with improving operations, it builds trust and openness with consumers. By utilizing this technology, workshops put themselves at the forefront of a new era in vehicle repair, creating the foundation for efficient, client-focused operations. Take advantage of mobile vehicle inspections and embrace the future."}, {"id": "S288", "product": "vehicle-mobile-inspection", "kind": "product-reference", "title": "Vehicle Mobile Inspection for Car Dealers Scroll to top", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-dealers/", "path": "pages/eed37d9353ddf0c0.html", "text": "Home\n»\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\n»\nVehicle Mobile Inspection for Car Dealers\nVehicle Mobile Inspection for Car Dealers\nVehicle Mobile Inspection for Car Dealers\nElevate Vehicle Inspection for vehicle sales and purchases. Vehicle Mobile Inspection for car dealers offers in-depth vehicle assessment, empowering car dealers to avoid potential losses during vehicle purchases and prevent customer disputes.\nThe automobile business is always changing, and auto dealers are looking for creative ways to improve their processes. The incorporation of mobile vehicle inspections is one such revolutionary technology. This innovation offers not only simplified procedures but also increased transparency and trust between dealerships and their esteemed clients.\nBenefits of Mobile Inspection for Car Dealers\nImproved Efficiency\nTime is a crucial component in the fast-paced world of vehicle sales. Mobile inspections have a revolutionary benefit since they dramatically cut down on the amount of time needed for evaluations. As a result, inventory turns over more quickly, guaranteeing that automobiles arrive at the sales floor in record time.\nHigher customer confidence and transparency\nThe foundation of a successful dealership-customer relationship is transparency. Customers receive thorough, precise information about a vehicle’s condition via mobile inspections. This increased openness fosters trust and gives customers the confidence to make decisions since they are fully informed.\nResource and cost-effectiveness optimization\nMobile inspections optimize resources in addition to cutting down on inspection time. On-site inspection overhead expenses can be greatly reduced for dealerships. This makes it possible for a more strategic use of resources, allowing the dealership to make investments in other important business areas.\nImplementing Mobile Inspection Solutions for Car Dealers\nMaking the Best Technology Partner Selection\nA crucial choice is choosing the best inspection platform. Dealerships should thoroughly assess features and capabilities to make sure they meet their unique requirements. A key factor in ensuring easy integration into current operations is compatibility with existing systems.\nOnboarding and Training\nSuccess depends heavily on equipping workers with the abilities needed to carry out mobile inspections. A thorough training program provides a smooth transition to this cutting-edge technique, increasing confidence and productivity in the process. The key to leveraging the advantages of mobile inspections is a well-trained staff.\nWorkflow Integration for Mobile Inspections\nMobile inspections must be fully integrated into the process of purchasing a car in order to be genuinely successful. To do this, certain post-inspection methods must be established. This guarantees a smooth procedure from evaluation to sales, reducing any potential delays or interruptions.\nEnsuring Compliance and Quality Assurance\nRegulatory Conformity\nCompliance with regulatory regulations and industry standards is a must. Dealerships must have thorough processes to reduce any potential hazards brought on by non-compliance. This guarantees that each inspection satisfies the essential regulatory requirements.\nQuality Assurance Procedures\nSetting and upholding high standards is essential to any successful dealership. Every car will satisfy the dealership’s quality standards thanks to the implementation of strict inspection processes. This not only protects the dealership’s reputation but also guarantees client trust and satisfaction.\nOvercoming Challenges\nMobile inspections provide many advantages, but there may also be drawbacks. Initial reluctance from employees and consumers, as well as possible barriers to technology adoption, are common barriers. However, effective methods for reducing these barriers include proactive communication and ongoing feedback loops.\nConclusion\nA turning point in the automobile sector has been reached with the incorporation of mobile vehicle inspections. Along with improving operations, it builds a relationship of trust and openness with consumers. By adopting this technology, dealerships put themselves at the fore of a new era in automobile retail, creating the foundation for efficient, customer-focused operations. Take advantage of mobile vehicle inspections and embrace the future."}, {"id": "S289", "product": "vehicle-mobile-inspection", "kind": "product-reference", "title": "Vehicle Mobile Inspection (VMI) for Car Rentals", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/", "path": "pages/5f2e14395781e601.html", "text": "Get Started Now\nVehicle Mobile Inspection (VMI) for Car Rentals\nYou don’t need to maintain vehicle damages on paper anymore\nHome\n»\nVehicle Mobile Inspection (VMI) | Vehicle Inspection App\n»\nVehicle Mobile Inspection (VMI) for Car Rentals\nVehicle Mobile Inspection (VMI) for Car Rentals\nVehicle Mobile Inspection (VMI) For Car Rentals\nVehicle Mobile Inspection (VMI) for Car Rentals is a specialized version of Vehicle Mobile Inspection (VMI) to automate below processes of car rentals:\nYou don’t need to maintain vehicle damages on paper anymore\nDon’t you feel it is outdated to record vehicle damages on paper? Is it not time consuming? Always you need to mark same vehicle damages for each vehicle checkout & check-in transaction. Always you need to compare the checkout & check-in sheets for finding the new damages.\nEliminate customer disputes on vehicle damages\nThere will be almost no dispute as every damage will be recorded along with pictures electronically & acknowledged by customer by electronic signature at the end of each checkout & checkin movement.\nDecrease Your Vehicle Maintenance Cost\nDon’t pay for the repair of damages which can be recovered from customer.\nIncrease Your Sales by not missing the invoicing of any Vehicle Damage\nAre you charging every vehicle damage? There are chances that you are missing some damages which can be charged to customer.\nDecrease Your Customer Wait Time\nDon’t let your customer to wait for each checkout & check-in movement. All the vehicle damages will be available from last movement on checkout & checkin screens. So there is no need to mark the vehicle damages from scratch on each checkout & checkin movement which you have to do in manual paper-based process. It really decreases customer waiting time.\nIncrease Your Staff Productivity\nDo you want your staff to be more productive? Don’t let their time to be wasted on manual checkout & check-in procedure.\nProtect Your Cars from Bad Drivers\nVehicle Mobile Inspection (VMI) will help you to easily identify bad drivers who damage your rental cars. You can block them to open new rental agreement in future.\nStart Using Free for 1 Month\nLet’s get you Started\nIf you want to know more about Vehicle Mobile Inspection (VMI), let’s get connected.\nGet in Touch"}, {"id": "S290", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-create-vehicle-checklist/", "path": "pages/90ddf9d69c915bb0.html", "text": "Watch source video online\nHow to create vehicle checklist?\nThis feature is only available on a web application so you need to use the web app available on https://app.speedautosystems.com/Account/Login so login on this link.\nThis feature is used to create a list of all those items which are issued with the vehicle as compulsory or optional accessories such as Spare Tire, Jack, Baby Seat and GPS etc.\nTo create a new checklist item click “+ CREATE NEW CHECKLIST ITEM” on right top corner.\nOnce a checklist item is created you can edit or delete it by clicking “ACTIONS” button attached to it.\nThis list would be available to you while checking out the vehicle, just tick the items which are being issued with the vehicle and at the time of check in the selected items will be visible so that their return is ensured.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S291", " ve a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S295", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/download-from-google-play-store/", "path": "pages/c7fab8c46b05f8fa.html", "text": "Watch source video online\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store?\nhttps://play.google.com/store/apps/details?id=com.speedautosystems.vmi.rental\nTo download and install mobile application go to Google Play Store for Android devices and in search box give VMI and press search. Select Vehicle Mobile Inspection (VMI) of Speed Auto Systems LLC, download and install this application.\nThis will appear in your mobile application Tap it to start and give your credentials to login if already signed up if not Tap “Sign Up”. Fill all the details and Click “Sign up” button.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S296", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-add-vehicle/", "path": "pages/454b6478d320bb46.html", "text": "Watch source video online\nHow to add vehicle?\nFor Web App\nClick “Vehicles” in the left navigation panel.\nOn the right side, a table containing already added vehicles in the fleet or a blank table, if no vehicle is added so far, will appear.\nTo add a new vehicle click “+ CREATE NEW VEHICLE” on right top corner.\nA form will appear to fill in the details of the new vehicle, Plate No, Branch, Make and Model are the compulsory fields to make the save button active.\nAlthough a long list is available in drop down of Make and Model yet a missing Make and/or Model can be added by clicking the “MISSING MAKE OR MODEL ?” button on right top corner.\nBy clicking “ACTIONS” button attached to a vehicle will give three options:-\nEdit. To edit the particulars of that specific vehicle.\nDe-Fleet. If a vehicle has been used in any movement and the vehicle is no more in use or not fit to be rented out so it can be de-fleeted from her A de-fleeted vehicle, whenever needed or becoming fit, can be made On-Fleet by selecting de- fleeted vehicles and changing its status by selecting “ACTIONS” Button.\nDelete. If a vehicle was added erroneously and yet not used in any movement so it can be deleted from here.\nFor Mobile App\nVehicles can be added from mobile application For that go to the mobile application, go to VMI Menu, tap “Add Vehicle” that will lead you to the Vehicle adding form:\nGive the plate number.\nSearch and add vehicle’s make and model, if make and model don’t exist in this list then go to the web application and follow the procedure explained earlier.\nGive the manufacturing year and tap “SAVE” button.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S297", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-close-vehicle-movement-on-a-staff/", "path": "pages/c0b4d0d6d071bd41.html", "text": "Watch source video online\nHow to close vehicle movement on a staff?\nTo Check-In a vehicle use the mobile application and check-in process is spread over six steps:-\nStep#1: tap “NRM Check-In” or “Staff Check-In”.\nStep#2: enter the Vehicle Plate Number or just scan the QR code this will fetch the vehicle as well as Driver’s Name automatica Enter fresh mileage on the odometer of vehicle and fuel level, give the location where the vehicle is being checked in. Keep the location of cell phone “On” so that system can record the geographical location automatically.\nStep#3: tick all the items available with the vehicle which were already with the vehicle at the time of check-out.\nStep#4: check the vehicle for exterior damages if any and mark these and take a photo to keep the record by tapping the camera button, complete process is already explained before in Agreement Check-In Process.\nStep#5: repeat the same process for the interior of the vehicle and proceed next.\nStep#6: Enter the notes if required, get driver’s signatures and tap “Finish” to finish the Check-In Process.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S298", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-fix-vehicle-damages/", "path": "pages/56627ab465008311.html", "text": "Watch source video online\nHow to Fix Vehicle Damages?\nThis feature is only available on a web application so you need to use the web app available on https://app.speedautosystems.com/Account/Login so login on this link.\nThe feature is to remove the damages, which has been repaired/rectified, from the record in the databa So click “Fix Vehicle Damages” in the left navigation panel. Only the authorized person would have the access to this feature.\nEnter the plate number of the vehicle of which the damages have been repaired and need to be removed from the database and press “SEARCH” button.\nSelect the damage and press the “REPAIR” button given below the damage description and ph\nThe damage will be removed from the database and will not appear in next check-out.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S299", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-generate-reports/", "path": "pages/829b27adc012ef8f.html", "text": "Watch source video online\nHow to Generate Reports / How to Check Movement History of Vehicles?\nThis feature is only available on a web application so you need to use the web app available on https://app.speedautosystems.com/Account/Login so login on this link.\nClick “Movements” link in the left navigation pan This will show you a table on the right containing all movements done over the past in the following manner: –\nSelect a default date or period from the drop-down list or give a date range for which you want to see the movements.\nGive plate number of a specific vehicle for which you want to see the movements else leave it blank if you want to see the movements of all vehicles in your fleet.\nGive a specific movement number if known as given in the second column of the table under the heading of “No”.\nGive reference number if known as given in the fourth column of the table.\nBy checking the box “Movements with New Damages” will show only those movements, which caused fresh/new damages to vehicles.\nYou can export to report in Xcel format by pressing the button given for this purpose on the right upper corner of the table.\nYou can view the details pertaining to a specific movement by pressing the “ACTIONS” button attached to it.\nYou can see the Check Card of a specific movement by pressing the “ACTIONS” button attached to it.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S300", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-give-vehicle-to-customer-on-rental-agreement/", "path": "pages/d4054cbea5361d60.html", "text": "Watch source video online\nHow to give a vehicle to a customer on rental agreement?\nTo Check-Out a vehicle use the mobile application and check-out process is spread over Seven Steps:-\nStep#1: tap “Agreement Check-Out”.\nStep#2: fill in the required information, like enter Vehicle Plate Number or just scan the QR code this will fetch the vehicle details automatica Enter customer’s name and email address, give agreement number if needed, enter mileage on the odometer of vehicle and fuel level, give the location from where the vehicle is being checked out. Keep the location of cell phone “On” so that system can record the geographical location automatically.\nStep#3: tap “Documents” link to open documents page where you can enter Passport, National ID and Driving License of the customer. Tap back button and tap “Next”.\nStep#4: tick all the items being issued with the vehicle and tap “Next”.\nStep#5: check the vehicle for exterior damages if any and mark these and take a photo to keep the record by tapping the camera button:\nThe small dot represents a small dent.\nThe large dot represents a large dent.\nThe thin line represents small scratch.\nThe fat line represents large scratch.\nCross represents crack or missing item.\nStep#6: check the vehicle for interior damages if any following the steps explained in Step#5.\nStep#7: Enter the notes if required, get customer’s signatures and sign yourself and tap “Finish” to finish the check-out process.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S301", "product": "vehicle-mobile-inspection", "kind": "tutorial", "title": "How to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)", "url": "https://speedautosystems.com/vehicle-mobile-inspection/for-car-rentals/how-to-use/how-to-initialize-the-application-for-effective-use/", "path": "pages/ab261671b5018be5.html", "text": "Watch source video online\nHow to Initialize the Application for Effective Use?\nThis feature is only available on a web application so you need to use the web app available on https://app.speedautosystems.com/Account/Login so login on this link.\nAdministration:\nAdministration module is to configure the system as per your business requirements. Click “Administration” link in the left navigation pan It has six options to follow:\nBranches. To add or edit a branch.\nRoles. To create various roles as well as the limit of access to the application as per their assigned role/task. These roles are to be assigned to various users subsequently.\nUsers. All users are created, edited or deleted here and assigned the role al Their permissions can also be modified from here also.\nLanguages. To add a new language of your region and modify various words used in the application as per your requirement and language.\nAudit Logs. This is a feature which gives a complete picture to the administrator that what activity has been done by a specific user on the application and at what time.\nSettings. This is the basics from where the application is initialized to function properly as per your business requirements.\nThese options will function in the way explained in proceeding paras.\nBranches:\nClick “Branches” in the left navigation pan This gives you the list of all the branches if already added otherwise only default Main Branch will appear here.\nTo add a branch click “+ CREATE NEW BRANCH” button on the right top corner. Fill in the details and press the “SAVE” button.\nA branch can be deleted or details about a branch can be edited by clicking the “ACTIONS” button attached to that specific branch. A branch can only be deleted until no action is taken from that branch, once any action has been done now that branch can’t be deleted.\nRoles:\nKeeping in view the job being performed by every individual, certain roles are defined here such as Admin, Fleet Manager or Booking Manager etc.\nTo create a new Role click “+ CREATE NEW ROLE” on right top corner.\nIf you want every new user, being created in the system, to be assigned with the same role as default then select the “Default” checkbox beside it.\nBy selecting the “Permissions” tag you can select the level of access, to information, to users assigned to that specific role.\nA user can be edited or deleted by selecting the “ACTIONS” button attached to it less Admin, User, and Customer which can only be edited.\nUsers:\nAll the users using the application will be added and assigned a specific role here.\nTo create a new User click “+ CREATE NEW USER” on right top corner. Fill in all the details.\nTo assign a role, select the Roles Tag. Tick all the roles to be assigned to this specific user.\nAfter having added a user, by clicking the “ACTIONS” button attached to it four options are available, Login as this user, Edit, Permissions and Delete.\nAdmin can create a new user password for any user who forgets his/her password by editing the user credentials.\nLanguages:\nThe feature is equipped with twelve languages by default, if the desired language is not available on the list you can add that language by clicking “+ CREATE NEW LANGUAGE” button on right top corner.\nClick the “ACTIONS” button attached to a language to apply “Change Texts” or “Set as default language”.\nAudit Logs:\nThis feature gives a complete report to the administrator about the usage of the application and various actions performed by various users as per the Date Range selected.\nGive the dates in Date Range and Give the User Name or leave it blank to see the report of actions by all users followed by clicking the “REFRESH” button.\nSettings:\nSettings link is basics from where the application is made ready or initialized to work as per your requirements or n\nIt has five different tabs leading to various settings:\nCommon\nThe first tab, which appears in right panel on clicking “Settings” link, is “Common”. Here you will do following actions:-\nSelect your time zone.\nEnter date Format.\nLeave other fields as these are and click “SAVE” button.\nProfile\nThe Second tab allows you to add your company’s letterhead as well as the logo of the company. The added letterhead will automatically appear on all the correspondence being automatically forwarded to your customers by the application.\nThese can be added by clicking the “Choose File” and picking the file where you have saved these.\nDocument Nos\nAlthough this feature is not much needed in VMI yet the Third tab will assist you in formatting your various entries such as Agreement No, which can be generated manually also but if you need the application to automatically generate it for you then what format it should follow can be defined here. Same way numbering of invoices and various vouchers etc.\nUser Management\nThe Fourth tab works to manage the users’ initial access process to the application.\nEmail (SMTP)\nThe last Tab allows you to make the settings to allow your application to send various emails to your customers.\nHow to use Vehicle Mobile Inspection for Car Rentals (VMI.Rental)\nHow to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Apple App Store? How to download Vehicle Mobile Inspection for Car Rentals (VMI.Rental) app from Google Play Store? How to Sign Up? How to Sign In? How to add vehicle? How to create vehicle QR Labels? How to create vehicle checklist? How to manage staff? How to give a vehicle to a customer on rental agreement? How to take a car back from a customer on rental agreement closing? How to open vehicle movement on a staff? How to close vehicle movement on a staff? How to generate reports? How to open rental agreement? How to Fix Vehicle Damages? How to Initialize the Application for Effective Use?"}, {"id": "S302", "product": "vehicle-mobile-inspection", "kind": "tutorial",
